# Manual testing build. Mirrors publish.yml, but pushes to a separate fork id on the
# CDN so it never overwrites the live release. There is deliberately no schedule:
# a nightly six-platform build was burning ~an hour of runner time every day and
# published to `wizards-testing`, which is upstream's channel, not ours.
name: Publish Testing

concurrency:
  group: publish-testing
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      fork_id:
        description: 'Fork id to publish to on Robust.Cdn (must already exist there)'
        required: true
        default: 'innovation-station-testing'
        type: string

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Fix Git security
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE/RobustToolbox"

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform linux-x64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: python3 Tools/publish_multi_request.py --fork-id "${{ inputs.fork_id }}"
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
