# Manual testing build. Mirrors publish.yml, but pushes to a separate fork id on the
# CDN so it never overwrites the live release. There is deliberately no schedule:
# a nightly six-platform build was burning ~an hour of runner time every day and
# published to `wizards-testing`, which is upstream's channel, not ours.
name: Publish Testing

concurrency:
  group: publish-testing
  # A cancellation during container replacement could interrupt a rollback.
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      fork_id:
        description: 'Fork id to publish to on Robust.Cdn (must already exist there)'
        required: true
        default: 'innovation-station-testing'
        type: string

jobs:
  build:
    runs-on: ${{ vars.ECONOMY_EDITOR_RUNNER || 'self-hosted' }}

    steps:
    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml python3-yaml

    - uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Fix Git security
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE/RobustToolbox"

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Check EconomyEditor testing deployment configuration
      env:
        ECONOMY_EDITOR_TOKEN: ${{ secrets.ECONOMY_EDITOR_TESTING_TOKEN || secrets.ECONOMY_EDITOR_TOKEN }}
        ECONOMY_EDITOR_BIND_ADDRESS: ${{ vars.ECONOMY_EDITOR_BIND_ADDRESS || '127.0.0.1' }}
        ECONOMY_EDITOR_PORT: ${{ vars.ECONOMY_EDITOR_TESTING_PORT || '5188' }}
      run: python3 Tools/EconomyEditor/scripts/deploy.py --preflight --channel testing

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform linux-x64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Build testing EconomyEditor with a fresh game snapshot
      id: economy_editor
      env:
        ECONOMY_EDITOR_IMAGE: is14-economy-editor-testing:${{ github.sha }}
      run: sh Tools/EconomyEditor/scripts/ci_build.sh

    - name: Save EconomyEditor deployment manifest
      uses: actions/upload-artifact@v4
      with:
        name: economy-editor-testing-${{ github.sha }}
        path: ${{ steps.economy_editor.outputs.manifest }}
        if-no-files-found: error

    - name: Publish version
      run: python3 Tools/publish_multi_request.py --fork-id "${{ inputs.fork_id }}"
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

    - name: Deploy testing EconomyEditor
      env:
        ECONOMY_EDITOR_TOKEN: ${{ secrets.ECONOMY_EDITOR_TESTING_TOKEN || secrets.ECONOMY_EDITOR_TOKEN }}
        ECONOMY_EDITOR_BIND_ADDRESS: ${{ vars.ECONOMY_EDITOR_BIND_ADDRESS || '127.0.0.1' }}
        ECONOMY_EDITOR_PORT: ${{ vars.ECONOMY_EDITOR_TESTING_PORT || '5188' }}
        ECONOMY_EDITOR_IMAGE: ${{ steps.economy_editor.outputs.image }}
        ECONOMY_EDITOR_CATALOG_VERSION: ${{ steps.economy_editor.outputs.catalog-version }}
      run: >-
        python3 Tools/EconomyEditor/scripts/deploy.py --channel testing
        --image "$ECONOMY_EDITOR_IMAGE" --commit "$GITHUB_SHA"
        --catalog-version "$ECONOMY_EDITOR_CATALOG_VERSION"
