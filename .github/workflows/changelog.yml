# From https://github.com/DeltaV-Station/Delta-v/
name: PR Changelogs
concurrency: commit_action
on:
  pull_request_target:
    types: [closed]

env:
  GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANGELOG_DIR: ${{ vars.CHANGELOG_DIR || 'Resources/Changelog/Changelog.yml' }}
  CHANGELOG_BRANCH: ${{ vars.CHANGELOG_BRANCH || 'master' }}
  PR_NUMBER: ${{ github.event.number }}

jobs:
  changelog:
    runs-on: self-hosted
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ vars.CHANGELOG_BRANCH || 'master' }}
          persist-credentials: true

      - name: Setup Git
        run: |
          git config --global user.name "${{ vars.CHANGELOG_USER || 'IS14 Bot' }}"
          git config --global user.email "${{ vars.CHANGELOG_EMAIL || 'bot@users.noreply.github.com' }}"
          git remote set-url origin https://${{ secrets.BOT_TOKEN }}@github.com/${{ github.repository }}.git
        shell: bash

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: |
          cd "Tools/changelog"
          npm install
        shell: bash

      - name: Generate Changelog
        run: |
          cd "Tools/changelog"
          node changelog.js
        shell: bash

      - name: Commit Changelog
        run: |
          git add -- "$CHANGELOG_DIR"

          if git diff --staged --quiet; then
            echo "No changelog entry in this PR, nothing to commit."
            exit 0
          fi

          git commit -m "${{ vars.CHANGELOG_MESSAGE || 'Automatic changelog update' }} (#${{ env.PR_NUMBER }})"
          git push origin HEAD:"$CHANGELOG_BRANCH"
        shell: bash
