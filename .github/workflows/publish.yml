name: Publish

concurrency:
  group: publish
  cancel-in-progress: false

on:
  workflow_dispatch:
  # schedule:
   # - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ${{ vars.ECONOMY_EDITOR_RUNNER || 'self-hosted' }}

    steps:
    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml python3-yaml

    - uses: actions/checkout@v3.6.0
      with:
        submodules: 'recursive'

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3.2.0
      with:
        dotnet-version: 10.0.x

    - name: Fix Git security
      run: |
        git config --global --add safe.directory /home/deatherd/actions-runner/_work/Innovation-SS14-25-/Innovation-SS14-25-/RobustToolbox

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Check EconomyEditor deployment configuration
      env:
        ECONOMY_EDITOR_TOKEN: ${{ secrets.ECONOMY_EDITOR_TOKEN }}
        ECONOMY_EDITOR_BIND_ADDRESS: ${{ vars.ECONOMY_EDITOR_BIND_ADDRESS || '127.0.0.1' }}
        ECONOMY_EDITOR_PORT: ${{ vars.ECONOMY_EDITOR_PORT || '5187' }}
      run: python3 Tools/EconomyEditor/scripts/deploy.py --preflight --channel production

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform linux-x64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Build EconomyEditor with a fresh game snapshot
      id: economy_editor
      env:
        ECONOMY_EDITOR_IMAGE: is14-economy-editor-production:${{ github.sha }}
      run: sh Tools/EconomyEditor/scripts/ci_build.sh

    - name: Save EconomyEditor deployment manifest
      uses: actions/upload-artifact@v4
      with:
        name: economy-editor-production-${{ github.sha }}
        path: ${{ steps.economy_editor.outputs.manifest }}
        if-no-files-found: error

    - name: Publish version
      run: python3 Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

    - name: Deploy EconomyEditor
      env:
        ECONOMY_EDITOR_TOKEN: ${{ secrets.ECONOMY_EDITOR_TOKEN }}
        ECONOMY_EDITOR_BIND_ADDRESS: ${{ vars.ECONOMY_EDITOR_BIND_ADDRESS || '127.0.0.1' }}
        ECONOMY_EDITOR_PORT: ${{ vars.ECONOMY_EDITOR_PORT || '5187' }}
        ECONOMY_EDITOR_IMAGE: ${{ steps.economy_editor.outputs.image }}
        ECONOMY_EDITOR_CATALOG_VERSION: ${{ steps.economy_editor.outputs.catalog-version }}
      run: >-
        python3 Tools/EconomyEditor/scripts/deploy.py --channel production
        --image "$ECONOMY_EDITOR_IMAGE" --commit "$GITHUB_SHA"
        --catalog-version "$ECONOMY_EDITOR_CATALOG_VERSION"

    # Uncomment once CHANGELOG_DISCORD_WEBHOOK / CHANGELOG_RSS_KEY are set in secrets.
    # The scripts are not executable, so they have to be run through python3.
    # - name: Publish changelog (Discord)
    #   run: python3 Tools/actions_changelogs_since_last_run.py
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #     DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}

    # - name: Publish changelog (RSS)
    #   run: python3 Tools/actions_changelog_rss.py
    #   env:
    #     CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
