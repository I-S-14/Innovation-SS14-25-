# SPDX-License-Identifier: AGPL-3.0-or-later
name: PR Changelogs (Batch)
concurrency: commit_action
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Collect merged PRs starting from this ISO date (e.g. 2026-03-05T00:00:00Z)'
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANGELOG_DIR: ${{ vars.CHANGELOG_DIR || 'Resources/Changelog/Changelog.yml' }}
  CHANGELOG_BRANCH: ${{ vars.CHANGELOG_BRANCH || 'master' }}
  START_DATE: ${{ inputs.start_date }}

jobs:
  changelog:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ vars.CHANGELOG_BRANCH || 'master' }}
          persist-credentials: true

      - name: Setup Git
        run: |
          git config --global user.name "${{ vars.CHANGELOG_USER || 'IS14 Bot' }}"
          git config --global user.email "${{ vars.CHANGELOG_EMAIL || 'bot@users.noreply.github.com' }}"
          git remote set-url origin https://${{ secrets.BOT_TOKEN }}@github.com/${{ github.repository }}.git
        shell: bash

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: |
          cd "Tools/changelog"
          npm install
        shell: bash

      - name: Generate Changelog
        run: |
          cd "Tools/changelog"
          node batch_changelog.js
        shell: bash

      - name: Commit Changelog
        run: |
          git add -- "$CHANGELOG_DIR"

          if git diff --staged --quiet; then
            echo "No new changelog entries, nothing to commit."
            exit 0
          fi

          git commit -m "Batch Changelog"
          git push origin HEAD:"$CHANGELOG_BRANCH"
        shell: bash
