- type: entity
  parent: BaseGameRule
  id: LoneAbductorSpawn
  components:
  - type: StationEvent
    earliestStart: 15
    reoccurrenceDelay: 45
    weight: 3 # Goobstation - 7.5 -> 4 # CorvaxGoob Changes: 4 > 3
    maxOccurrences: 1 # CorvaxGoob Changes: abductors spawn balance
    minimumPlayers: 25 # CorvaxGoob Changes: 10 > 25
    duration: null # Goobstation - chud
    chaos:
      Hostile: 75
      Medical: 75
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 100
  - type: RuleGrids
  - type: LoadMapRule
    mapPath: /Maps/_Shitmed/Shuttles/ShuttleEvent/abductor_shuttle.yml
  - type: AntagObjectives
    objectives:
    - AbductObjective
  - type: AntagLoadProfileRule
    speciesHardOverride: Abductor
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: IS14LoneAbductorSpawnAntag0d03bb4e8
      range:
        max: 1
        min: 1
      playerRatio: 10
- type: entity
  parent: BaseGameRule
  id: AbductorVictim
  components:
  - type: AbductorVictimRule
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: IS14AbductorVictimAntag08bb180b6
      range:
        max: 1
        min: 1
      playerRatio: 10
  - type: AntagRandomObjectives
    maxDifficulty: 1
    sets:
    - maxPicks: 1
      groups: AbductorVictimObjectiveGroups

