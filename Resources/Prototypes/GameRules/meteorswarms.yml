## Event Tables

- type: entityTable
  id: MeteorSwarmDustEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: SpaceDustMinor
    - id: SpaceDustMajor

- type: entityTable
  id: MeteorSwarmSmallChanceEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: MeteorSwarmSmall
      prob: 0.15

- type: entityTable
  id: MeteorSwarmMildTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - !type:NestedSelector
        tableId: MeteorSwarmDustEventsTable
    - !type:NestedSelector
        tableId: MeteorSwarmSmallChanceEventsTable

- type: entityTable
  id: BasicMeteorSwarmEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - !type:NestedSelector
        tableId: MeteorSwarmDustEventsTable
    - id: GameRuleMeteorSwarmSmall
    - id: GameRuleMeteorSwarmMedium
    - id: GameRuleMeteorSwarmLarge
    - id: GameRuleUristSwarm
    - id: ImmovableRodSpawn

- type: weightedRandomEntity
  id: MeteorSpawnAsteroidWallTable
  weights:
    MeteorRock: 10
    MeteorRockCoal: 5
    MeteorRockQuartz: 5
    MeteorRockTin: 5
    MeteorRockSilver: 2
    MeteorRockGold: 2
    MeteorRockPlasma: 2
    MeteorRockDiamond: 2
    MeteorRockUranium: 0.5
    MeteorRockBananium: 0.5
    MeteorRockBSCrystal: 0.5 # Goobstation

## Event Schedulers

- type: entity
  parent: BaseGameRule
  id: MeteorSwarmScheduler
  components:
  - type: GameRule
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 600 # 10 min
    minMaxEventTiming:
      min: 300 # 5 min - Goob Edit
      max: 5400 # 90 min - Goob Edit
    scheduledGameRules: !type:NestedSelector
      tableId: BasicMeteorSwarmEventsTable

- type: entity
  parent: BaseGameRule
  id: MeteorSwarmMildScheduler
  components:
  - type: GameRule
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 600 # 10 min
    minMaxEventTiming:
      min: 300 # 5 min - Goob Edit
      max: 5400 # 90 min - Goob Edit
    scheduledGameRules: !type:NestedSelector
      tableId: MeteorSwarmMildTable

- type: entity
  parent: BaseGameRule
  id: KesslerSyndromeScheduler
  components:
  - type: GameRule
  - type: RampingStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: BasicMeteorSwarmEventsTable

## Game Rules

- type: entity
  parent: BaseGameRule
  id: GameRuleMeteorSwarm
  abstract: true
  components:
  - type: GameRule
  - type: StationEvent
    # CorvaxGoob-CustomAnnouncers-Start
    startAudio:
      path: /Audio/Announcements/meteors_start.ogg
    endAudio:
      path: /Audio/Announcements/meteors_end.ogg
    startAnnouncement: station-event-meteor-swarm-start-announcement
    endAnnouncement: station-event-meteor-swarm-end-announcement
    announcersStartAudio:
      Intern:
        collection: InternEventMeteor
    announcersEndAudio:
      Intern:
        path: /Audio/_CorvaxGoob/Announcements/Announcers/Intern/meteorcleared.ogg
    # CorvaxGoob-CustomAnnouncers-End
    reoccurrenceDelay: 1
    earliestStart: 12
    minimumPlayers: 25
  - type: MeteorSwarm

- type: entity
  parent: GameRuleMeteorSwarm
  id: GameRuleSpaceDustMinor
  components:
  - type: StationEvent
    weight: 44
    earliestStart: 2
    # CorvaxGoob-CustomAnnouncers-Start
    startAudio:
      path: /Audio/Announcements/attention.ogg
    startAnnouncement: station-event-space-dust-start-announcement
    endAnnouncement: station-event-space-dust-end-announcement
    announcersStartAudio:
      Intern:
        path: /Audio/_CorvaxGoob/Announcements/Announcers/Intern/dust.ogg
    announcersEndAudio:
      Intern:
        path: /Audio/_CorvaxGoob/Announcements/Announcers/Intern/dust_passed.ogg
    # CorvaxGoob-CustomAnnouncers-End
    minimumPlayers: 0
    chaos: # Goobstation
      Power: 10
      Atmos: 10
  - type: MeteorSwarm
    announcement: null
    announcementSound: null
    nonDirectional: true
    meteors:
      MeteorSpaceDust: 1
    waves:
      min: 2
      max: 3
    meteorsPerWave:
      min: 3
      max: 5

- type: entity
  parent: GameRuleMeteorSwarm
  id: GameRuleSpaceDustMajor
  components:
  - type: StationEvent
    weight: 22
    duration: 60 # CorvaxGoob-CustomAnnouncers
    minimumPlayers: 0
    # CorvaxGoob-CustomAnnouncers-Start
    startAnnouncement: station-event-space-dust-start-announcement
    endAnnouncement: station-event-space-dust-end-announcement
    announcersStartAudio:
      Intern:
        path: /Audio/_CorvaxGoob/Announcements/Announcers/Intern/dust.ogg
    announcersEndAudio:
      Intern:
        path: /Audio/_CorvaxGoob/Announcements/Announcers/Intern/dust_passed.ogg
    # CorvaxGoob-CustomAnnouncers-End
    chaos: # Goobstation
      Power: 25
      Atmos: 25
  - type: MeteorSwarm
    # announcement: station-event-space-dust-start-announcement # Commented by CorvaxGoob-CustomAnnouncers
    # announcementSound: /Audio/Announcements/attention.ogg # Commented by CorvaxGoob-CustomAnnouncers
    nonDirectional: true
    meteors:
      MeteorSpaceDust: 1
    waves:
      min: 2
      max: 3
    meteorsPerWave:
      min: 8
      max: 12

- type: entity
  parent: GameRuleMeteorSwarm
  id: GameRuleMeteorSwarmSmall
  components:
  - type: StationEvent
    weight: 18
    minimumPlayers: 15
    chaos: # Goobstation
      Power: 40
      Atmos: 40
  - type: MeteorSwarm
    meteors:
      MeteorSmall: 7
      MeteorMedium: 3

- type: entity
  parent: GameRuleMeteorSwarm
  id: GameRuleMeteorSwarmMedium
  components:
  - type: StationEvent
    weight: 10
    chaos: # Goobstation
      Power: 50
      Atmos: 50
  - type: MeteorSwarm
    meteors:
      MeteorSmall: 3
      MeteorMedium: 6
      MeteorLarge: 1

- type: entity
  parent: GameRuleMeteorSwarm
  id: GameRuleMeteorSwarmLarge
  components:
  - type: StationEvent
    weight: 5
    chaos: # Goobstation
      Power: 60
      Atmos: 60
  - type: MeteorSwarm
    meteors:
      MeteorSmall: 2
      MeteorMedium: 4
      MeteorLarge: 4

