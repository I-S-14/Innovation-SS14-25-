- type: gameMap
  id: Meta
  mapName: 'Meta Station'
  mapPath: /Maps/_Goobstation/meta.yml # Goobstation
  minPlayers: 30 # Goobstation return minPlayers requirement for maps
  maxPlayers: 85 # Goobstation - Limit mappool to highpop versions of maps only
  stations:
    Meta:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Meta Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_meta.yml
        - type: StationJobs
          availableJobs:
            #service
            Captain: [ 1, 1 ]
            JobMupRepresentative: [ 1, 1 ] # IS14 Edit
            BlueshieldOfficer: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            CommandSecretary: [ 1, 1 ] # IS14 Edit
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 3 ]
            Chef: [ 2, 2 ]
            Janitor: [ 1, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            ChurchServant: [ 1, 1 ] # IS14 Edit
            #engineering
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 5, 7 ]
            TechnicalAssistant: [ 3, 6 ]
            SeniorEngineer: [ 1, 1 ] # IS14 Edit
            #medical
            ChiefMedicalOfficer: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 5, 5 ]
            MedicalIntern: [ 3, 6 ]
            Paramedic: [ 1, 1 ]
            SeniorPhysician: [ 1, 1 ] # IS14 Edit
            #science
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 5, 7 ]
            ResearchAssistant: [ 3, 6 ]
            SeniorResearcher: [ 1, 1 ] # IS14 Edit
            #security
            JobHosMilitia: [ 1, 1 ] # IS14 Edit
            JobLrrChief: [ 1, 1 ] # IS14 Edit
            JobMilitia: [ 5, 7 ] # IS14 Edit
            JobInvestigator: [ 1, 1 ] # IS14 Edit
            IS_JobCadet: [ 3, 6 ] # IS14 Edit
            IS_JobLawyer: [ 2, 2 ] # IS14 Edit
            JobMedOfficer: [ 1, 1 ] # IS14 Edit
            InternalControlExecutor: [ 1, 1 ] # IS14 Edit
            JobSeniorMilitia: [ 1, 1 ] # IS14 Edit
            IS_JobPilot: [ 1, 1 ] # IS14 Edit
            JobIvk: [ 1, 1 ] # IS14 Edit
            #supply
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 3, 3 ]
            CargoTechnician: [ 3, 3 ]
            SeniorExpeditioner: [ 1, 1 ] # IS14 Edit
            #civilian
            Passenger: [ -1, -1 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            #silicon
            StationAi: [ 1, 1 ]
            Borg: [ 2, 2 ]

        # Goobstation blob-config-start HUGE
        - type: StationBlobConfig
          stageBegin: 40
          stageCritical: 450
          stageTheEnd: 900
        # Goobstation blob-config-end

        #IS14-change start
        - type: StationEconomy
          accounts:
            - StationTreasury
            - StationEngineering
            - StationMedical
            - StationSecurity
            - StationCargo
            - StationService
            - StationResearch
        #IS14-change end
