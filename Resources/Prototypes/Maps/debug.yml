- type: gameMap
  id: Empty
  mapName: Empty
  mapPath: /Maps/Test/empty.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Empty"
        - type: StationJobs
          availableJobs:
            Passenger: [ -1, -1 ]

- type: gameMap
  id: Dev
  mapName: Dev
  mapPath: /Maps/Test/new_dev.yml # IS14 change
  minPlayers: 0
  stations:
    Dev:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Dev"
        - type: StationJobs
          availableJobs:
            Captain: [ -1, -1 ]
            BlueshieldOfficer: [ -1, -1 ] # Remove this too
            JobHosMilitia: [ -1, -1 ]
            JobMilitia: [ -1, -1 ]
            JobSeniorMilitia: [ -1, -1 ]
            IS_JobCadet: [ -1, -1 ]
            JobInvestigator: [ -1, -1 ]
            JobMedOfficer: [ -1, -1 ]
            JobLrrChief: [ -1, -1 ]
            IS_JobPilot: [ -1, -1 ]
            JobIvk: [ -1, -1 ]
            IS_JobLawyer: [ -1, -1 ]
            JobMupRepresentative: [ -1, -1 ]
        # Goobstation blob-config-start DEBUG
        - type: StationBlobConfig
          stageBegin: 20
          stageCritical: 50
          stageTheEnd: 100
        # Goobstation blob-config-end
        #IS14-change start
        - type: StationEconomy
          accounts:
            - StationTreasury
            - StationEngineering
            - StationMedical
            - StationSecurity
            - StationCargo
            - StationService
            - StationResearch
        #IS14-change end

- type: gameMap
  id: TestTeg
  mapName: Test TEG
  mapPath: /Maps/Test/test_teg.yml
  minPlayers: 0
  stations:
    TEG:
      stationProto: TestStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "TEG"
        - type: StationJobs
          availableJobs:
            ChiefEngineer: [ -1, -1 ]
