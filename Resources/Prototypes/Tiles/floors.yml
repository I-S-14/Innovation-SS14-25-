- type: tile
  abstract: true
  id: BaseStationTile
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepFloor
  heatCapacity: 10000
  tileRipResistance: 4500 # Goob
  weather: false
  baseTurf: Plating
  baseWhitelist:
  - PlatingBrass
  - FloorAsteroidIronsand
  - FloorAsteroidSand
  - FloorAsteroidSandBorderless
  - FloorAsteroidIronsandBorderless
  - FloorAsteroidSandRedBorderless
  - PlatingAsteroid
  - PlatingSnow
  - FloorPlanetDirt
  - FloorDesert
  - FloorLowDesert
  - FloorPlanetGrass
  - FloorSnow
  - FloorDirt
  - PlatingRCD
  - FloorHullReinforced
  - FloorBasaltLavaland
  - FloorPlanetAsh
  - FloorPlanetGrassLight
  materialComposition:
    Steel: 100 # 0.5 for lattice, 0.25 for plating, 0.25 for tile

