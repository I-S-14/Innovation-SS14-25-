- type: tile
  id: BasePlating
  abstract: true
  friction: 1.5
  heatCapacity: 10000
  isSubfloor: true
  # Goobstation - Fireaxe plating prying
  deconstructTools: [ Axing ]
  deconstructTimeMultiplier: 5 # Goobstation
  footstepSounds:
    collection: FootstepPlating
  materialComposition:
    Steel: 75 # 0.75 sheets; 0.5 for the lattice, 0.25 for the tile
  baseTurf: Lattice

- type: tile
  id: Plating
  parent: BasePlating
  name: tiles-plating
  sprite: /Textures/Tiles/plating.png

- type: tile
  id: PlatingDamaged
  parent: BasePlating
  name: tiles-plating
  sprite: /Textures/Tiles/plating-damaged.png
  variants: 4
  baseTurf: Lattice
  isSubfloor: true
  footstepSounds:
    collection: FootstepPlating
  friction: 0.3
  heatCapacity: 10000
  # Goobstation - Fireaxe plating prying
  deconstructTools: [ Axing ]
  deconstructTimeMultiplier: 5 # Goobstation

- type: tile
  id: PlatingRCD
  parent: Plating
  name: tiles-rcd-plating
  baseWhitelist:
    - Space
    - FloorPlanetDirt
    - FloorDesert
    - FloorPlanetGrass
    - FloorSnow
    - FloorDirt
    - FloorAsteroidIronsand
    - FloorAsteroidSand
    - FloorAsteroidSandBorderless
    - FloorAsteroidIronsandBorderless

- type: tile
  id: FloorHullReinforced
  parent: BasePlating
  name: tiles-hull-reinforced
  sprite: /Textures/Tiles/debug-indestructible.png
  footstepSounds:
    collection: FootstepHull
  itemDrop: FloorTileItemSteel
  heatCapacity: 100000 #/tg/ has this set as "INFINITY." I don't know if that exists here so I've just added an extra 0
  indestructible: true

- type: tile
  id: PlatingAsteroid
  parent: BasePlating
  name: tiles-asteroid-plating
  sprite: /Textures/Tiles/Asteroid/asteroid_plating.png
  # Goobstation - Fireaxe plating prying
  deconstructTools: [ Axing ]
  deconstructTimeMultiplier: 5 # Goobstation

- type: tile
  id: PlatingSnow
  name: tiles-snow-plating
  parent: BasePlating
  sprite: /Textures/Tiles/Snow/snow-plating.png #Not in the snow planet RSI because it doesn't have any metadata. Should probably be moved to its own folder later.
  baseTurf: Lattice
  isSubfloor: true
  # Goobstation - Fireaxe plating prying
  deconstructTools: [ Axing ]
  deconstructTimeMultiplier: 5 # Goobstation
  friction: 0.75 #a little less then actual snow

- type: tile
  id: Lattice
  name: tiles-lattice
  sprite: /Textures/Tiles/lattice.png
  baseTurf: Space
  isSubfloor: true
  deconstructTools: [ Cutting ]
  deconstructTimeMultiplier: 1 # Goobstation
  weather: true
  footstepSounds:
    collection: FootstepCatwalk
  friction: 1.5
  isSpace: true
  itemDrop: PartRodMetal1
  heatCapacity: 10000
  mass: 200
  variants: 3
  materialComposition:
    Steel: 50 # 0.5 sheets = 1 rod
