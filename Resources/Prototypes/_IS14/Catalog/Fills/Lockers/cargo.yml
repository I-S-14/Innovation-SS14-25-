# Shared items between all miner-exploration roles - stuff needed for mining.
# Salvage specialist lockers
- type: entity
  id: IS14ExpeditionLockerFilledHardsuit
  suffix: Filled, Hardsuit
  parent: IS14ExpeditionLocker
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillSalvageSpecialistHardsuitSpatio
        - !type:NestedSelector
          tableId: LockerFillSalvageSpecialist

- type: entity
  id: IS14ExpeditionLockerFilled
  suffix: Filled
  parent: IS14ExpeditionLocker
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LockerFillSalvageSpecialist

# Shaft miner lockers
- type: entity
  id: IS14ExpeditionLockerMinerFilledHardsuit
  suffix: Filled, Hardsuit
  parent: IS14ExpeditionLockerFilled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillShaftMinerExplorerSuit
        - !type:NestedSelector
          tableId: LockerFillShaftMiner

- type: entity
  id: IS14ExpeditionLockerMinerFilled
  suffix: Filled
  parent: IS14ExpeditionLockerFilled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LockerFillShaftMiner

