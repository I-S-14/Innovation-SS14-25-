    - id: IS14ModsuitSecurity
    - id: PowerCellMedium
    - id: IS14ModuleVisorSecurity
    - id: IS14ModuleArmorBooster
    - id: IS14ModulePepper

- type: entity
  parent: CrateEngineeringSecure
  id: IS14CrateModsuitMining
  name: mining MOD crate
  description: A mining MOD controller with a drill, an ore bag and a GPS.
  components:
  - type: StorageFill
    contents:
    - id: IS14ModsuitMining
    - id: PowerCellMedium
    - id: IS14ModuleDrill
    - id: IS14ModuleOreBag
