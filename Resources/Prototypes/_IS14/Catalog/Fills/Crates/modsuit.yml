#
# Ящики с МОДами. До этого файла костюм в раунде мог появиться только из
# экзокостюмного фабрикатора — то есть почти никогда.
#
# В каждом ящике готовый к работе костюм: ядро уже стоит внутри прототипа
# контроллера, поэтому докладываем только запасную ячейку и профильные модули.

- type: entity
  parent: CrateEngineeringSecure
  id: IS14CrateModsuitEngineering
  name: engineering MOD crate
  description: A Nakamura Engineering MOD controller, a spare cell and a pair of modules.
  components:
  - type: StorageFill
    contents:
    - id: IS14ModsuitEngineering
    - id: PowerCellMedium
    - id: IS14ModuleFlashlight
    - id: IS14ModuleTrayScanner
    - id: IS14ModuleAtmosphericsSmall

- type: entity
  parent: CrateEngineeringSecure
  id: IS14CrateModsuitAtmospheric
  name: atmospherics MOD crate
  description: An atmospherics MOD controller with a large bottle and a thermal regulator.
  components:
  - type: StorageFill
    contents:
    - id: IS14ModsuitAtmospheric
    - id: PowerCellMedium
    - id: IS14ModuleAtmosphericsLarge
    - id: IS14ModuleThermalRegulator

- type: entity
  parent: CrateMedicalSecure
  id: IS14CrateModsuitMedical
  name: medical MOD crate
  description: A medical MOD controller with an analyser and a defibrillator module.
  components:
  - type: StorageFill
    contents:
    - id: IS14ModsuitMedical
    - id: PowerCellMedium
    - id: IS14ModuleHealthAnalyzer
    - id: IS14ModuleDefibrillator
    - id: IS14ModuleVisorMedical

- type: entity
  parent: CrateSecgear
  id: IS14CrateModsuitSecurity
  name: security MOD crate
  description: A security MOD controller with a visor, armour booster and pepper launcher.
  components:
  - type: StorageFill
