# Костюм без специализации — то, что берут, когда нужен просто скафандр,
# который потом соберут под себя.
- type: entity
  parent: CrateInternals
  id: IS14CrateModsuitStandard
  name: MOD crate
  description: A plain MOD controller with a spare cell. Everything else is up to you.
  components:
  - type: StorageFill
    contents:
    - id: IS14ModsuitStandard
    - id: PowerCellMedium

- type: entity
  parent: CrateEngineeringSecure
  id: IS14CrateModsuitCores
  name: MOD core crate
  description: A plasma core and a spare standard core, for suits that outlive their batteries.
  components:
  - type: StorageFill
    contents:
    - id: IS14ModCorePlasma
    - id: IS14ModCoreStandard
    - id: PowerCellHigh

- type: entity
  parent: CrateGenericSteel
  id: IS14CrateModsuitModules
  name: MOD module crate
  description: An assortment of general-purpose MOD modules.
  components:
  - type: StorageFill
    contents:
    - id: IS14ModuleFlashlight
    - id: IS14ModuleStorage
