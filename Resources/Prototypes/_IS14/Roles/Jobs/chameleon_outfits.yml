# Chameleon outfits for the IS14 militia / justice jobs.
# Every job that has both a startingGear and a roleLoadout needs one of these
# (see Content.IntegrationTests.Tests.Chameleon.ChameleonJobLoadoutTest).

- type: chameleonOutfit
  id: HosMilitiaChameleonOutfit
  job: JobHosMilitia
  hasMindShield: true
  equipment:
    head: ClothingHeadIS14HosMilitiaCap
    eyes: ClothingEyesIS14MilitiaGlasses
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckIS14HosMilitiaCloak
    outerClothing: ClothingOuterIS14HosMilitiaGreatcoat
    gloves: ClothingHandsIS14HosMilitiaGloves
    shoes: ClothingShoesIS14HosMilitiaBoots

