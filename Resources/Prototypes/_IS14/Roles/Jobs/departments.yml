#
# Структура отделов Innovation Station.
# Заменяет ванильные Resources/Prototypes/Roles/Jobs/departments.yml
# и _CorvaxGoob/Roles/Jobs/departments.yml — там всё закомментировано.
#
# Идентификаторы прототипов намеренно совпадают с ванильными: на них завязаны
# DepartmentTimeRequirement в требованиях профессий, allowedDepartments у
# контрабанды, покраска шлюзов, реагенты и условия аплинка (~220 ссылок).
# Название, описание, цвет и состав отделов при этом полностью наши.

# ========================================
# МОКО
# ========================================
- type: department
  id: CentralCommand
  name: department-IS14Moko
  description: department-IS14Moko-description
  color: "#0c344d"
  weight: 120
  roles:
  - CentralCommandOfficial # Инспектор МОКО (ПЦК)
  - NavyCaptain # Директор штаба МОКО
  - SpecialOperationsOfficer # Офицер штаба реагирования министерства обороны (ОСО)
  - BlueshieldOfficer # Оперативник государственной службы охраны (ОСЩ)
  - NavyOfficer
  - Diplomat
  - Inspector

