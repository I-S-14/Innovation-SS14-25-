- type: entity
  parent: BaseAction
  id: ActionModsuitToggleDeploy
  name: Deploy MODsuit
  description: Deploys or retracts every part of the suit.
  components:
  - type: Action
    icon:
      sprite: _IS14/Interface/Actions/modsuit.rsi
      state: deploy
    # Костюм сам дёргает SetToggled по развёрнутым частям, поэтому кнопка показывает
    # то, что сделает следующим нажатием, а не то, что уже сделано.
    iconOn:
      sprite: _IS14/Interface/Actions/modsuit.rsi
      state: retract
    itemIconStyle: BigAction
    useDelay: 1
  - type: InstantAction
    event: !type:ModsuitToggleDeployEvent

- type: entity
  parent: BaseAction
  id: ActionModsuitToggleSeal
  name: Seal MODsuit
  description: Seals or unseals the deployed parts, one at a time.
  components:
  - type: Action
    icon:
      sprite: _IS14/Interface/Actions/modsuit.rsi
      state: activate
    iconOn:
      sprite: _IS14/Interface/Actions/modsuit.rsi
      state: activate-ready
    itemIconStyle: BigAction
    useDelay: 1
  - type: InstantAction
    event: !type:ModsuitToggleSealEvent

- type: entity
  parent: BaseAction
  id: ActionModsuitOpenPanel
  name: MODsuit panel
  description: Opens the suit's readout — charge, plating, modules and their settings.
  components:
  - type: Action
    icon:
      sprite: _IS14/Interface/Actions/modsuit.rsi
      state: panel
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:ModsuitOpenPanelEvent

- type: entity
  parent: BaseAction
  id: ActionModsuitOpenModules
  name: MODsuit modules
  description: Brings up the module ring for quick switching.
  components:
  - type: Action
    icon:
      sprite: _IS14/Interface/Actions/modsuit.rsi
      state: module
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:ModsuitOpenModulesEvent
