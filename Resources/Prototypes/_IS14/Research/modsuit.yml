#
# Три узла в Industrial. До этого все 35 рецептов лежали в статическом паке и
# печатались с первой минуты, из-за чего синдикатский модуль стоил столько же
# усилий, сколько фонарик.
#
# Тему открывает обшивка, а не костюм: каркасы печатаются с первой минуты и одни
# на всех, так что узел покупает именно право собрать МОД этой специальности.
# Ядер тут нет — их наука не делает вовсе, они приходят из карго.
#
# Позиции подобраны в свободных клетках слева от ветки утилизаторов; ветка
# растёт вниз-влево и ни на что существующее не наезжает.

