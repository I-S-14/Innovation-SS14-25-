# Job economy configuration for IS14.
# ID must match the corresponding JobPrototype ID exactly.
# salaryIntervalSeconds: seconds between payments — omit for the default (600 = 10 minutes).
# payerAccount: station account (department fund) the salary is debited from.
#   Default: StationTreasury. If the fund is empty, the salary is delayed and debt accumulates.

# ─── Command ────────────────────────────────────────────────────────────────
# Captain and HoP are paid by the treasury (default).
# Department heads are paid from their own department's fund — the head starves with the crew.

- type: jobEconomy
  id: Captain
  minBalance: 1500
  maxBalance: 3000
  salary: 400
- type: jobEconomy
  id: HeadOfPersonnel
  minBalance: 800
  maxBalance: 1500
  salary: 280
- type: jobEconomy
  id: ChiefEngineer
  minBalance: 800
  maxBalance: 1500
  salary: 280
  payerAccount: StationEngineering

- type: jobEconomy
  id: ChiefMedicalOfficer
  minBalance: 800
  maxBalance: 1500
  salary: 280
  payerAccount: StationMedical

- type: jobEconomy
  id: ResearchDirector
  minBalance: 800
  maxBalance: 1500
  salary: 280
  payerAccount: StationResearch

- type: jobEconomy
  id: HeadOfSecurity
  minBalance: 800
  maxBalance: 1500
  salary: 280
  payerAccount: StationSecurity

- type: jobEconomy
  id: Quartermaster
