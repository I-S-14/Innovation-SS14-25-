# Base IS14 vending machine — override Sprite, MachineName and tabs in children
- type: entity
  id: IS14VendingMachineBase
  name: Торговый автомат
  description: Продаёт разные вещи за кредиты.
  parent: BaseStructureDynamic
  abstract: true
  components:
  - type: IS14VendingMachine
  - type: UserInterface
    interfaces:
      enum.IS14VendingMachineUiKey.Key:
        type: IS14VendingMachineBoundUserInterface
  - type: Wires
    boardName: wires-board-name-vendingmachine
    layoutId: IS14Vending
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/engivend.rsi
    snapCardinals: true
    layers:
    - state: off
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: normal-unshaded
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded

