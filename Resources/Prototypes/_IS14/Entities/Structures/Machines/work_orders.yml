# Department order terminals. Phase 4, 5.5 of Docs/_IS14/research-design.md: a head commissions
# a topic, and when the NIC delivers it the department pays in its own kind of data and out of
# its own budget.
#
# One terminal per department, because the department is what differs: its currency, its
# budget, and who may sign. The rates live on the terminal, so a generous department is a
# prototype change and not a code change.

- type: entity
  abstract: true
  parent: BaseComputer
  id: IS14BaseWorkOrderConsole
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: request
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  # A research client so the terminal knows what has already been delivered: an order for
  # something the NIC finished an hour ago would be a nuisance, not a commission.
  - type: ResearchClient
  - type: ActivatableUI
    key: enum.IS14WorkOrderUiKey.Key
  - type: UserInterface
    interfaces:
      enum.IS14WorkOrderUiKey.Key:
        type: IS14WorkOrderBui
  - type: ActiveRadio
    channels:
    - Science

- type: entity
  parent: IS14BaseWorkOrderConsole
  id: IS14WorkOrderConsoleEngineering
  name: терминал заявок инженерии
  description: Отсюда главный инженер заказывает НИЦ нужную технологию. Заявка оплачивается из бюджета инженерии и промышленными данными.
  components:
  - type: IS14WorkOrderConsole
    department: Engineering
    departmentName: is14-workorder-department-engineering
    account: StationEngineering
    pointType: Industrial
    bonus: 60
    payment: 2000
  - type: AccessReader
    access: [["Engineering"]]

