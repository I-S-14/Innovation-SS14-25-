# IS14 ATM: insert an ID card, enter a PIN, withdraw/deposit cash and transfer credits.
- type: entity
  parent: BaseMachinePowered
  id: IS14Atm
  name: банкомат
  description: Выдаёт и принимает наличные, переводит кредиты между счетами. Вставьте ID-карту.
  components:
  - type: IS14Atm
    cashStackType: IS14Credit
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ItemSlots
    slots:
      is14-atm-card-slot:
        name: is14-atm-card-slot-name
        insertSound: /Audio/Machines/id_insert.ogg
        ejectSound: /Audio/Machines/id_swipe.ogg
        whitelist:
          components:
          - IdCard
  - type: ActivatableUI
    key: enum.IS14AtmUiKey.Key
    singleUser: true
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.IS14AtmUiKey.Key:
        type: IS14AtmBoundUserInterface
  - type: Sprite
    sprite: _IS14/Structures/Machines/atm.rsi
    snapCardinals: true
    layers:
    - state: "off"
    - state: "on"
      shader: unshaded
      visible: false
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3aadbb"
  - type: LitOnPowered
