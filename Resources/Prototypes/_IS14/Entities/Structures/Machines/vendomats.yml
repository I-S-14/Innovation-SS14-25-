# IS14 fork vending machines — use the IS14 economy system (paid, revenue goes to a department fund).
# Vanilla vending machines are untouched and keep the vanilla free-vend UI.
# Everything shared (power, anchoring, wires, breakage, screen visuals, light, sprite layers)
# lives in IS14VendingMachineBase — children set only goods, ad datasets and the RSI path.
# UI title defaults to the entity name; sprite layers use the standard vanilla state names.

# ─── Милиция ────────────────────────────────────────────────────────────────

- type: entity
  parent: IS14VendingMachineBase
  id: IS14VendingMachineMilicia
  name: MilicVend
  description: Автомат снаряжения милиции.
  components:
  - type: IS14VendingMachine
    revenueAccount: StationSecurity
    tabs:
    - name: Форма
      inventory:
      - itemId: ClothingBackpackSecurity
        price: 200
        stock: 3
      - itemId: ClothingUniformJumpsuitSec
        price: 150
        stock: 3
      - itemId: ClothingHeadHatBeretSecurity
        price: 150
        stock: 3
      - itemId: ClothingShoesBootsJack
        price: 150
        stock: 3
    - name: Спецсредства
      access: [ Security ]
      inventory:
      - itemId: Handcuffs
        price: 300
        stock: 4
      - itemId: Flash
        price: 250
        stock: 3
      - itemId: GrenadeFlashBang
        price: 400
        stock: 2
  - type: DatasetVocalizer
    dataset: IS14MilicVendAds
  - type: SpeakOnUIClosed
    pack: IS14MilicVendGoodbyes
  - type: Sprite
    sprite: _IS14/Structures/Machines/Vends/milicia.rsi

