# Payroll consoles — a department head raises, cuts, rewards or fines the crew paid by their fund.
# Every operation settles against managedAccount, so raises and bonuses drain the department budget
# and fines top it back up. Access is gated per department by the head's own access level.
# Salary and bonus limits are server-wide and live in the is14.payroll_* cvars, not here.
- type: entity
  parent: IS14BaseComputer
  id: IS14PayrollConsole
  abstract: true
  name: консоль расчёта зарплат
  description: Терминал кадровой службы отдела. Начисляет оклады, премии и штрафы из бюджета отдела.
  components:
  - type: PointLight
    color: "#3ab77a"
  - type: Computer
    board: ComputerBroken
  - type: ActivatableUIRequiresAccess
  - type: ActivatableUI
    key: enum.PayrollConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PayrollConsoleUiKey.Key:
        type: PayrollConsoleBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: IS14PayrollConsole
  id: IS14PayrollConsoleEngineering
  name: консоль расчёта зарплат инженерии
  components:
  - type: AccessReader
    access: [[ "ChiefEngineer" ], [ "Captain" ]]
  - type: PayrollConsole
    managedAccount: StationEngineering

