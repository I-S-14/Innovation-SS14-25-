- type: entity
  parent: ComputerResearchAndDevelopment
  id: IS14ComputerResearch
  name: R&D computer
  description: A computer used to interface with R&D tools.
  suffix: IS14
  components:
  - type: Sprite
    sprite: _IS14/Structures/Machines/research_console.rsi
    noRot: true
    layers:
    - map: ["enum.ComputerVisualLayers.Frame"]
      state: computer
    - map: ["enum.ComputerVisualLayers.Keyboard"]
      state: generic_keyboard
    - map: ["enum.ComputerVisualLayers.Screen"]
      sprite: _IS14/Structures/Machines/research_console_screen.rsi
      state: rdcomp
    - map: ["enum.ComputerVisualLayers.Keys"]
      state: rd_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: ComputerVisuals # IS14: retain the custom states with modern layer keys.
    stateFrame: computer
    stateKeyboard: generic_keyboard
    stateScreen: rdcomp
    stateKeys: rd_key
    statePanel: generic_panel_open
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.4,-0.4,1.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
