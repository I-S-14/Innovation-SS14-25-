- type: entity
  parent: CrateBaseLockBox
  id: IS14CrateExport
  categories: []
  components:
  - type: OverrideSell
    overrideAccount: Cargo
  - type: Icon
    sprite: _IS14/Structures/Storage/Crates/export.rsi
    state: icon
  - type: Sprite
    sprite: _IS14/Structures/Storage/Crates/export.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: overlay
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: overlay-closed
      map: [lid_overlay]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: locked
      shader: unshaded
      map: ["enum.LockVisualLayers.Lock"]
    - state: paper
      sprite: Structures/Storage/Crates/labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: Paintable
    group: null

