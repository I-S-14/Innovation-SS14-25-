- type: entity
  abstract: true
  parent: [ BaseItem, StorePresetUplink ] #PDA's have uplinks so they have to inherit the data.
  id: IS14_PdaBase
  name: PDA
  description: Personal Data Assistant.
  components:
  - type: Sprite
    layers:
    - state: "closed"
      map: [ "enum.IS14OsVisualLayers.Base" ]
    - state: "unlit"
      shader: unshaded
      visible: false
      map: [ "enum.IS14OsVisualLayers.Screen" ]
  - type: Appearance
  # IS14 OS: the lid is the session (Docs/_IS14/os-design.md §5.3). Z opens the lid, boots the
  # OS and shows the screen; closing the window or stowing the PDA shuts it again.
  - type: IS14OsDevice
    profile: OsProfileHandheld
    theme: OsNtOs
  - type: IS14OsMemory
    preinstalled:
    - AppNotes
    - AppMessenger
    - AppCamera
    - AppGallery
    - AppManifest
  # The lid is what drains the cell, so the player controls the drain (Docs §5.6).
  # A flat battery never blocks the ID slot: that stays mechanical.
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: Pda
    paiSlot:
      priority: -2
      whitelist:
        components:
        - PAI
    penSlot:
      startingItem: Pen
      priority: -1
      whitelist:
        tags:
        - Write
    idSlot:
      name: access-id-card-component-default
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        components:
        - IdCard
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      PDA-id: !type:ContainerSlot {}
      PDA-pen: !type:ContainerSlot {}
      PDA-pai: !type:ContainerSlot {}
      cell_slot: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      cell_slot:
        # Below the ID slot so alt-click still reaches the card, which is what players want.
        priority: -3
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
  - type: Clothing
    quickEquip: false
    slots:
    - idcard
    - Belt
  - type: Ringer
  - type: RingerUplink
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: PDA
    prefix: device-address-prefix-console
    savableAddress: false
  - type: WirelessNetworkConnection
    range: 500
  - type: UserInterface
    interfaces:
      enum.IS14OsUiKey.Key:
        type: IS14OsBui
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.RingerUiKey.Key:
        type: RingerBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon
    - WhitelistChameleonPDA
  - type: BlockMovement
    blockInteraction: false # lets the PDA toggle its own flashlight
