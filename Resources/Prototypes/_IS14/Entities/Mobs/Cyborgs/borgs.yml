- type: entity
  id: IS14BorgChassisYasari
  parent: [BaseBorgChassis, BaseBorgTransponder]
  components:
    # from BaseBorgChassisNT start - Remove SlavedBorg, SiliconLawProvider
    - type: RandomMetadata
      nameSegments:
      - NamesBorg
    - type: NpcFactionMember
      factions:
      - NanoTrasen
    - type: Access
      groups:
      - AllAccess
      tags:
      - Borg
    - type: AccessReader
      access: [["Command"], ["Research"]]
    - type: ShowJobIcons
    - type: StationAiVision # Goobstation - AI can see through NT silicon
      range: 3
    - type: InteractionPopup
      interactSuccessSound:
        path: /Audio/Ambience/Objects/periodic_beep.ogg
    # from BaseBorgChassisNT end
    - type: Sprite
      sprite: _IS14/Mobs/Silicon/chassis.rsi
      layers:
      - state: yasari
        map: ["enum.BorgVisualLayers.Body", "movement"]
      - state: yasari_e
        map: ["enum.BorgVisualLayers.Light"]
        shader: unshaded
        visible: false
      - state: yasari_e
        shader: unshaded
        map: ["light","enum.BorgVisualLayers.LightStatus"]
        visible: false
    - type: BorgChassis
      hasMindState: yasari_empty
      noMindState: yasari_empty
    - type: BorgTransponder
      sprite:
        sprite: _IS14/Mobs/Silicon/chassis.rsi
        state: yasari
      name: cyborg
    - type: SiliconLawProvider
      laws: YasariStatic
      subverted: true
    - type: NightVision

- type: entity
  id: IS14PlayerBorgYasari
  parent: IS14BorgChassisYasari
  suffix: Battery, Module
  components:
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - BorgModuleTool
        - BorgModuleFireExtinguisher
        - BorgModuleTelekines
        - BorgModulePolice
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
  - type: RandomMetadata
    nameSegments: [NamesBorg]
