# prisoner clothing

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadIS14PrisonerCap
  name: prisoner cap
  description: A cheap cap issued to inmates.
  components:
  - type: Sprite
    sprite: _IS14/Clothing/Head/Specific/prisoner_cap.rsi
  - type: Clothing
    sprite: _IS14/Clothing/Head/Specific/prisoner_cap.rsi
    equippedState: equipped-HEAD
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon

- type: entity
  parent: ClothingUniformJumpsuitIS14Base
  id: ClothingUniformJumpsuitIS14Prisoner
  name: prisoner jumpsuit
  description: A jumpsuit used for prisoners. It has suit sensors automatically enabled at all times.
  components:
  - type: Sprite
    sprite: _IS14/Clothing/Uniforms/Specific/prisoner.rsi
  - type: Clothing
    sprite: _IS14/Clothing/Uniforms/Specific/prisoner.rsi
    equipSound:
      path: /Audio/Items/jumpsuit_equip.ogg
  - type: SuitSensor
    controlsLocked: true
    randomMode: false
    mode: SensorCords
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - PrisonUniform
    - WhitelistChameleon
