    sprite: _IS14/Clothing/OuterClothing/Hardsuits/militia_suit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.75
        Caustic: 0.6
  - type: StaminaResistance
    damageCoefficient: 0.6
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetIS14Militia

