# Детали, из которых собирают МОД.
#
# Сама сборка — граф IS14Modsuit (см. Recipes/Construction/Graphs/modsuit.yml).
# Здесь только предметы: заготовка, на которой идёт сборка, четыре каркаса и
# обшивки. Каркасы одинаковы для всех тем — медицинский шлем отличается от
# инженерного не железом, а обшивкой, которую на него варят в самом конце.
# Поэтому рецептов каркасов четыре, а не сорок четыре.

# --------------------------------------------------------------- заготовка

- type: entity
  parent: BaseItem
  id: IS14ModsuitShell
  name: MOD shell
  description: An empty MOD frame. Everything a suit is made of goes inside this.
  components:
  - type: Sprite
    sprite: _IS14/Objects/Modsuit/construction.rsi
    layers:
    - state: assembly-start
      map: ["assembly"]
  - type: Item
    size: Ginormous
  - type: Appearance
  # Граф пишет сюда номер шага, а не имя: VisualizerDataInt умеет только int,
  # поэтому ключи здесь — числа. Так же устроена сборка мехов.
  - type: GenericVisualizer
    visuals:
      enum.ModsuitAssemblyVisuals.Stage:
        assembly:
          0: { state: assembly-start }
          1: { state: assembly-core }
          2: { state: assembly-screwed_core }
          3: { state: assembly-helmet }
          4: { state: assembly-chestplate }
          5: { state: assembly-gauntlets }
          6: { state: assembly-boots }
          7: { state: assembly-wrenched_assembly }
          8: { state: assembly-screwed_assembly }
          9: { state: assembly-screwed_assembly }
  - type: Construction
    graph: IS14Modsuit
    node: start
    # Без цели пути осмотр молчит: подсказку «далее» система показывает только для
    # ребра, которое уже начато, либо для того, что ведёт к defaultTarget.
    defaultTarget: modsuit

# ----------------------------------------------------------------- каркасы

- type: entity
  abstract: true
  parent: BaseItem
  id: IS14ModsuitFrameBase
  components:
  - type: Sprite
    sprite: _IS14/Objects/Modsuit/construction.rsi
  - type: Item
    size: Normal

- type: entity
  parent: IS14ModsuitFrameBase
  id: IS14ModsuitFrameHelmet
  name: MOD helmet frame
  description: An unplated MOD helmet. Fits any shell; what it becomes is decided by the plating.
  components:
  - type: Sprite
    state: helmet
  - type: Tag
    tags:
    - IS14ModsuitFrameHelmet

- type: entity
  parent: IS14ModsuitFrameBase
  id: IS14ModsuitFrameChestplate
  name: MOD chestplate frame
  description: The load-bearing piece of a MOD. Heavy, empty, and useless on its own.
  components:
  - type: Sprite
    state: chestplate
  - type: Tag
    tags:
    - IS14ModsuitFrameChestplate

- type: entity
  parent: IS14ModsuitFrameBase
  id: IS14ModsuitFrameGauntlets
  name: MOD gauntlet frames
  description: A pair of unplated MOD gauntlets.
  components:
  - type: Sprite
    state: gauntlets
  - type: Tag
    tags:
    - IS14ModsuitFrameGauntlets

- type: entity
  parent: IS14ModsuitFrameBase
  id: IS14ModsuitFrameBoots
  name: MOD boot frames
  description: A pair of unplated MOD boots.
  components:
  - type: Sprite
    state: boots
  - type: Tag
    tags:
    - IS14ModsuitFrameBoots

# ----------------------------------------------------------------- обшивки
#
# Обшивка — единственная деталь, которая знает о специальности. Приваривается
# последней, и до этого момента сборка остаётся безымянной железкой.

