    sealedComponents:
    - type: PressureProtection
      highPressureMultiplier: 0.02
      lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients: *IS14ArmorEngineering

- type: entity
  parent: IS14ModsuitPartBootsBase
  id: IS14ModsuitBootsAtmospheric
  categories: [ HideSpawnMenu ]
  name: atmospheric MOD boots
  components:
  - type: Sprite
    sprite: _IS14/Clothing/Modsuits/atmospheric.rsi
  - type: Clothing
    sprite: _IS14/Clothing/Modsuits/atmospheric.rsi
