# =========================================================== МАГНАТСКИЙ
# Командный корпус: дорогой, вместительный и заметный. Его и должно быть видно.
- type: entity
  parent: IS14ModsuitPartHelmetBase
  id: IS14ModsuitHelmetMagnate
  categories: [ HideSpawnMenu ]
  name: magnate MOD helmet
  components:
  - type: Sprite
    sprite: _IS14/Clothing/Modsuits/magnate.rsi
  - type: Clothing
    sprite: _IS14/Clothing/Modsuits/magnate.rsi
  # Дорогая композитная плита: ровные 40% и по механике, и по физике.
  - type: Armor
    modifiers:
      coefficients: &IS14ArmorMagnate
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.6
        Cold: 0.6
        Shock: 0.6
        Caustic: 0.6
  # Прочность вдвое против базовой — командная модель того же класса, что и
  # у СБ, и снимают её обычно там же.
  - type: ModsuitPart
    maxIntegrity: 500

