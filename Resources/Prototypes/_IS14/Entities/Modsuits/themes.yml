# =========================================================== АТМОСФЕРНЫЙ

- type: entity
  parent: IS14ModsuitPartHelmetBase
  id: IS14ModsuitHelmetAtmospheric
  categories: [ HideSpawnMenu ]
  name: atmospheric MOD helmet
  components:
  - type: Sprite
    sprite: _IS14/Clothing/Modsuits/atmospheric.rsi
  - type: Clothing
    sprite: _IS14/Clothing/Modsuits/atmospheric.rsi
  # Атмосу дышать там, где давление рвёт обычный МОД. Барометрия берёт худшую
  # из надетых частей, а не их произведение, — планку поднимаем на всех четырёх.
  - type: ModsuitPart
    sealedComponents:
    - type: PressureProtection
      highPressureMultiplier: 0.02
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coolingCoefficient: 0.01
      heatingCoefficient: 0.01
  # Защита инженерной темы один в один — тот же набор, тот же якорь.
  - type: Armor
    modifiers:
      coefficients: *IS14ArmorEngineering

