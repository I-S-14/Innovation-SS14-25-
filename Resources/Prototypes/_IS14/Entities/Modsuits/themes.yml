  categories: [ HideSpawnMenu ]
  name: atmospheric MOD gauntlets
  components:
  - type: Sprite
    sprite: _IS14/Clothing/Modsuits/atmospheric.rsi
  - type: Clothing
    sprite: _IS14/Clothing/Modsuits/atmospheric.rsi
