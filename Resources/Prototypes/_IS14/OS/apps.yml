# --- Head-of-department software (Docs §12). Stationary only: these are the consoles the
# departments already had, moved onto the platform so a head can put two of them side by side.
# Payroll and orders carry no data component of their own — which fund a payroll console
# administers, and which account an order console spends from, are properties of that console,
# so the console entity declares them and the app is only a window onto what is already there.

- type: osApp
  id: AppPayroll
  icon: /Textures/_IS14/Interface/OS/Apps/payroll.png
