# Applications. An app is this prototype plus the components it puts on the device —
# no entity is spawned per install. See Docs/_IS14/os-design.md §6.1.

# --- System partition: installed on every device, cannot be removed. ---

- type: osApp
  id: AppStatus
  icon: /Textures/Interface/VerbIcons/information.svg.192dpi.png
  name: is14-os-app-status-name
  description: is14-os-app-status-desc
  category: System
  source: [ Preinstalled ]
  undeletable: true
  order: 0
  size: 2
  windowSize: 340,240

- type: osApp
  id: AppFiles
  icon: /Textures/Interface/VerbIcons/group.svg.192dpi.png
  name: is14-os-app-files-name
  description: is14-os-app-files-desc
  category: System
  source: [ Preinstalled ]
  undeletable: true
  order: 90
  size: 3
  windowSize: 360,300
  components:
  - type: IS14OsFiles

- type: osApp
  id: AppSettings
  icon: /Textures/Interface/Nano/gear.svg.192dpi.png
  name: is14-os-app-settings-name
  description: is14-os-app-settings-desc
  category: System
  source: [ Preinstalled ]
  undeletable: true
  order: 91
  size: 3
  windowSize: 340,240

