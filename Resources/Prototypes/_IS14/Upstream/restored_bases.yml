  - type: StaticPrice
    price: '0'
- type: entity
  parent: HolofanProjector
  id: HolofanProjectorBorg
  name: integrated holofan
  description: Stops idiots from causing more crew harm during atmospheric emergencies.
    Installed directly into an engineering cyborg, it recharges over time.
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: 'true'
        swap: 'false'
- type: entity
  id: LockerBaseSecure
  parent: IS14LockerBaseCommon # IS14-change: keep Goob's 150/300 without inheriting weak-locker destruction.
  abstract: 'true'
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: '300'
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: '150'
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: '-6'
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: '1'
            max: '2'
- type: entity
  id: MeteorRock
  parent: AsteroidRock
  name: meteorite rock
  description: What remains of a meteorite.
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: '12'
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: '-6'
