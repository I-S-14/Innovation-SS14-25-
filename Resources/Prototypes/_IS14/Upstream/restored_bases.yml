- type: entity
  id: AnomalyRockBananium
  parent: AnomalyRockBase
  suffix: Rock, Bananium
  components:
  - type: Sprite
    color: "#ddde40"
  - type: PointLight
    radius: '2.0'
    energy: '7.5'
    color: "#ddde40"
  - type: EntitySpawnAnomaly
    entries:
    - settings:
        spawnOnPulse: 'true'
        minAmount: '8'
        maxAmount: '15'
        minRange: '4.5'
        maxRange: '7.5'
      spawns:
      - WallSpawnAsteroid
      - WallSpawnAsteroid
      - WallSpawnAsteroidBananium
      - WallSpawnAsteroidBananiumCrab
    - settings:
        spawnOnPulse: 'true'
        maxAmount: '3'
        minRange: '2.5'
        maxRange: '4.5'
      spawns:
      - CrystalYellow
    - settings:
        spawnOnSuperCritical: 'true'
        minAmount: '30'
        maxAmount: '40'
        minRange: '5'
        maxRange: '15'
      spawns:
      - CrystalYellow
      - WallSpawnAsteroid
      - WallSpawnAsteroid
      - WallSpawnAsteroidBananiumCrab
    - settings:
        spawnOnSuperCritical: 'true'
        minAmount: '3'
        maxAmount: '6'
        maxRange: '5'
      spawns:
      - MobSpawnCrabBananium
- type: entity
  id: BaseDebris
  abstract: 'true'
  components:
  - type: OwnedDebris
  - type: LocalityLoader
- type: entity
  abstract: 'true'
  parent: BaseStructure
  id: BaseGateway
  name: gateway
  description: A mysterious gateway built by unknown hands, it allows for faster than
    light travel to far-flung locations.
  components:
  - type: Sprite
    sprite: Structures/Machines/gateway.rsi
    noRot: 'true'
    layers:
    - state: frame
    - state: portal
      shader: unshaded
      map: ["enum.GatewayVisualLayers.Portal"]
    - state: 'on'
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          'True': {visible: 'true'}
          'False': {visible: 'false'}
      enum.GatewayVisuals.Active:
        enum.GatewayVisualLayers.Portal:
          'True': {visible: 'true'}
          'False': {visible: 'false'}
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: 'true'
  - type: Fixtures
    fixtures:
      portalFixture:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: 'false'
  - type: Appearance
- type: entity
  id: BaseMobAnimal
  abstract: 'true'
  components:
  - type: Body
    prototype: Animal
- type: entity
  id: BaseMobBloodsucker
  abstract: 'true'
  components:
  - type: Body
