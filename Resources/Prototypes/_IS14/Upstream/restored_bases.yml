- type: entity
  id: BaseStationGateway
  abstract: 'true'
  components:
  - type: GatewayGenerator
- type: entity
  abstract: 'true'
  id: ClothingHeadSuitWithLightBase
  name: base hardsuit helmet with light
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: 'false'
      shader: unshaded
      map: ["light"]
  - type: Clothing
    equippedPrefix: 'off'
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: 'false'
    radius: '3'
    energy: '2'
    lightMask: ConeSingle
    autoRot: 'true'
    netsync: 'false'
  - type: Appearance
  - type: HandheldLight
    addPrefix: 'true'
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      id: radiating
      interpolate: Linear
      maxDuration: '2.0'
      startValue: '3.0'
      endValue: '2.0'
      isLooped: 'true'
      reverseWhenFinished: 'true'
    - !type:PulseBehaviour
      id: blinking
      interpolate: Nearest
      maxDuration: '1.0'
      startValue: '0.1'
      endValue: '2.0'
      isLooped: 'true'
  - type: Battery
    maxCharge: '600'
    startingCharge: '600'
  - type: BatterySelfRecharger
    autoRechargeRate: '2'
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitColorGrey
  name: grey jumpsuit
  description: A tasteful grey jumpsuit that reminds you of the good old days.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuits/Color/color.rsi
    layers:
    - state: icon
      color: "#b3b3b3"
    - state: trinkets-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#b3b3b3"
      - state: trinkets-inhand-left
      right:
      - state: inhand-right
        color: "#b3b3b3"
      - state: trinkets-inhand-right
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuits/Color/color.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#b3b3b3"
      - state: trinkets-equipped-INNERCLOTHING
- type: entity
  abstract: 'true'
  parent: DrinkCartonBaseFull
