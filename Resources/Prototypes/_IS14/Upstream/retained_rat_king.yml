    damage:
      types:
        Poison: -0.5
      groups:
        Brute: -0.3
        Burn: -0.3
  - type: Satiation
    satiations:
      Hunger:
        prototype: IS14RatKingHunger
      Thirst:
        prototype: IS14RatKingThirst
