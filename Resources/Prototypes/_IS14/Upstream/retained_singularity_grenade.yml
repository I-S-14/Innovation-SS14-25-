# IS14: restore definitions lost during upstream file moves.
# Source: bd217732d1:Resources/Prototypes/Entities/Objects/Weapons/Throwable/grenades.yml
- type: entity
  parent: [FragileGrenadeBase, IS14WizardTimerGrenadeBase, BaseSyndicateContraband]
  id: SingularityGrenade
  name: singularity grenade
  description: Grenade that simulates the power of a singularity, pulling things in
    a heap.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/singularitygrenade.rsi
  - type: TimerTrigger
    delay: 3
    beepInterval: 0.46
    beepSound:
      path: /Audio/Effects/Grenades/Supermatter/smbeep.ogg
      params:
        volume: -5
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/Grenades/Supermatter/smbeep.ogg
      params:
        volume: -5
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      path: /Audio/Effects/Grenades/Supermatter/supermatter_start.ogg
      params:
        volume: 5
  - type: AnchorOnTrigger
    keysIn:
    - timer
    removeOnTrigger: true
  - type: TwoStageTrigger
    keysIn:
    - timer
    triggerDelay: 10.45
    components:
    - type: AmbientSound
      enabled: true
      volume: -5
      range: 14
      sound:
        path: /Audio/Effects/Grenades/Supermatter/supermatter_loop.ogg
    - type: GravityWell
      maxRange: 5
      minRange: 0.25
      baseRadialAcceleration: 25
      baseTangentialAcceleration: 5
      gravPulsePeriod: 0.03
    - type: SingularityDistortion
      intensity: 150
      falloffPower: 1.5
    - type: PointLight
      enabled: true
      color: "#ffaa44"
      energy: 8
      radius: 6
      softness: 1
      offset: "0, 0"
    - type: EmitSoundOnTrigger
      sound:
        path: /Audio/Effects/Grenades/Supermatter/supermatter_end.ogg
        params:
          volume: 5
      positional: true
      keysIn:
      - stageTwo
    - type: DeleteOnTrigger
      keysIn:
      - stageTwo
  - type: StaticPrice
    price: 1000
