- type: entity
  id: ProjectileLocker
  name: cursed locker
  description: A cursed magical locker! Can you resist?
  parent: ClosetSteelBase
  categories: [HideSpawnMenu]
  components:
  - type: ResistLocker
    resistTime: 60
  - type: Ammo
    muzzleFlash: null
  - type: FadingTimedDespawn
    lifetime: 120
    fadeOutTime: 5
  - type: StoreOnCollide
    lockOnCollide: true
    disableWhenFirstOpened: true
    disableOnSleep: true
    whitelist:
      components:
      - MobState
  - type: LockVisuals
    stateLocked: cursed_door
    stateUnlocked: decursed_door
  - type: Lock
    breakOnAccessBreaker: false
  - type: AccessReader
    access: [["Wizard"]]
    breakOnAccessBreaker: false
  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
    damage:
      types:
        Brute: 0
  - type: Sprite
    noRot: true
    sprite: Structures/Storage/closet.rsi
    layers:
    - state: cursed
      map: ["enum.StorageVisualLayers.Base"]
    - state: decursed_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
    - state: cursed_door
      map: ["enum.LockVisualLayers.Lock"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorageVisuals
    stateBaseClosed: decursed
    stateDoorOpen: decursed_open
    stateDoorClosed: decursed_door
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 0.6
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: false
- type: entity
  id: ProjectilePolyboltBase
  abstract: true
  parent: BaseBullet
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: magicm_green
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Poison: 0
  - type: TriggerOnCollide
    fixtureID: projectile
    maxTriggers: null
  - type: PolymorphOnTrigger
    targetUser: true
  - type: Reflective
    reflective: Magic
  - type: Ammo
    muzzleFlash: null
  - type: Trail
    lerpTime: 0.05
    frequency: 0.02
    lifetime: 1
    alphaLerpAmount: 0.4
    shader: unshaded
    sprite:
      sprite: /Textures/Objects/Weapons/Guns/Projectiles/magic.rsi
      state: magicm_green
