# IS14: retained Goob action; current Sprite icon schema and dedicated camera light sensor.
- type: entity
  parent: BaseAction
  id: ActionSurvCameraLights
  name: Toggle camera lights
  description: Enable surveillance camera lights near wherever you're viewing.
  components:
  - type: Action
    priority: -5
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: camera_light
  - type: InstantAction
    event: !type:RelayedActionComponentChangeEvent
      components:
      - type: LightOnCollideCollider
      - type: FixturesChange
        fixtures:
          aiLightTrigger:
            shape: !type:PhysShapeCircle
              radius: 0.35
            density: 80
            hard: false
            layer:
            - GhostImpassable
