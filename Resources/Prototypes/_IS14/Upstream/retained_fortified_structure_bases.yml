# IS14: retained special variants without ordinary-parent destruction.
# Candle: current Entities/Objects/Misc/candles.yml, retaining inherited Inorganic damage container.
# Flock: current _Goobstation/Flock/Structures/walls.yml, shared fields unchanged.
- type: entity
  name: candle
  parent: [BaseItem]
  id: IS14RetainedCandleBase
  description: A thin wick threaded through fat.
  components:
  - type: Tag
    tags:
    - Candle
  - type: Sprite
    noRot: true
    sprite: Objects/Misc/candles.rsi
    layers:
    - state: candle-big
      color: "#decb8e"
  - type: Item
    size: Small
  - type: Appearance
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: ExtinguishOnInteract
    extinguishAttemptSound:
      path: /Audio/Items/candle_blowing.ogg
      params:
        variation: 0.05
        volume: 10
  - type: UseDelay
  - type: ExtinguishableSetCollisionWake
  - type: Flammable
    fireSpread: false
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: true
    firestacksOnIgnite: 3.0
    firestackFade: -0.01
    damage:
      types:
        Heat: 0.1
  - type: FireVisuals
    sprite: Objects/Misc/candles.rsi
    normalState: fire-big
  - type: SpookyExtinguishable
  - type: ToggleableVisuals
    spriteLayer: null
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  abstract: true
- type: entity
  parent: BaseStructure
  id: IS14RetainedFlockWallBase
  name: strange glass wall
  abstract: true
  description: You can hear faint humming coming from within.
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: _Goobstation/Flock/Structures/Walls/featherzone.rsi
    state: full
    drawdepth: Walls
    noRot: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
    damageContainer: StructuralInorganic
  - type: Airtight
  - type: SunShadowCast
  - type: Occluder
  - type: Tag
    tags:
    - Wall
  - type: AmbientSound
    volume: -10
    range: 2
    sound:
      path: /Audio/Ambience/Objects/gravity_gen_hum.ogg
  - type: PointLight
    radius: 4
    energy: 1.6
    color: "#0fb79a"
    castShadows: true
    netsync: false
