        amount: 2
        doAfter: 1
      - material: Plastic
        amount: 2
        doAfter: 1
      - material: MetalRod
        amount: 4
        doAfter: 1
    - to: station
      steps:
      - material: Steel
        amount: 2
        doAfter: 1
      - material: Plastic
        amount: 2
        doAfter: 1
