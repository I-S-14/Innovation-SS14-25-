# Раскладка по паку решает, что печатается с начала раунда, а что после
# исследования. Статический пак — входной билет: простой костюм и пара модулей,
# чтобы система вообще была видна в раунде. Всё остальное идёт через науку.

- type: latheRecipePack
  id: IS14ModsuitStatic
  recipes:
  - IS14ModCoreStandard
  - IS14ModsuitStandard
  - IS14ModuleFlashlight
  - IS14ModuleStorage

# Динамические паки. Рецепт открывается технологией, но станок должен знать о нём
# заранее, иначе открывать будет нечего.

- type: latheRecipePack
