# Экзокостюмный фабрикатор печатает детали, а не костюмы: четыре каркаса, обшивку
# темы и модули. Собирают из этого руками — см. Entities/Modsuits/construction.yml.
#
# Ядер здесь нет ни одного, и это не упущение: ядро в раунде появляется только из
# карго. Наука делает оболочку, снабжение — то, что заставляет её работать.

# ----------------------------------------------------------- заготовка
#
# Корпус, на котором идёт вся сборка. Несущая часть костюма и потому самая
# дорогая печать набора.

- type: latheRecipe
  id: IS14ModsuitShell
  result: IS14ModsuitShell
  categories:
  - Robotics
  completetime: 6
  materials:
    Steel: 500
    Plastic: 200

# ------------------------------------------------------- каркасы частей
#
# Одинаковы для всех тем: тему задаёт обшивка, а не железо под ней. Печатаются
# с первой минуты — без обшивки это всё равно четыре куска металла.

- type: latheRecipe
  id: IS14ModsuitFrameHelmet
  result: IS14ModsuitFrameHelmet
  categories:
  - Robotics
  completetime: 3
  materials:
    Steel: 300
    Glass: 150

