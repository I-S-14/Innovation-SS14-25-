# tg's borghypo: synthesizes the chosen medicine.
- type: entity
  parent: [IS14BaseCyborgTool, BorgHypo]
  id: IS14CyborgToolHypo
  categories: [ HideSpawnMenu ]
  components:
  - type: UserInterface
    interfaces:
      enum.CyborgReagentUiKey.Key:
        type: CyborgReagentBoundUserInterface
  - type: CyborgReagentSynthesizer
    solution: hypospray
    reagents:
    - Bicaridine
    - Tricordrazine
    - Kelotane
    - Dexalin
    - Saline
    - Dylovene
    emagReagents:
    - ChloralHydrate
    - Lexorin
    - Toxin

