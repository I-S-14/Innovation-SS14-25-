# Dispensers: print items where the cyborg clicks, use in hand to switch.
- type: entity
  parent: [IS14BaseCyborgTool, BaseItem]
  id: IS14CyborgToolCookieSynth
  name: cookie synthesizer
  description: Prints a fresh cookie. A peacekeeper's best argument.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/misc.rsi
    state: COOKIE!!!
  - type: UseDelay
    delay: 3
  - type: UserInterface
    interfaces:
      enum.CyborgDispenserUiKey.Key:
        type: CyborgDispenserBoundUserInterface
  - type: CyborgDispenser
    chargeCost: 15
    options:
    - FoodBakedCookie
    - FoodBakedCookieSugar

# Not in the service kit for now, kept for later.
