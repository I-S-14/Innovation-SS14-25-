# Cyborg-only tools from tgstation that have no SS14 counterpart.

# tg's /obj/item/borg/cyborg_omnitool/engineering.
- type: entity
  parent: [IS14BaseCyborgTool, PowerDrill]
  id: IS14CyborgToolOmnitool
  name: cyborg omni-toolset
  description: A set of engineering tools built into a cyborg's arm. Switch between them with a press.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/items_cyborg.rsi
    layers:
    - state: toolkit_engiborg
  - type: Tool
    qualities:
    - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  # The multitool is part of the set, like tg's: wire hacking and multitool checks need the tag.
  - type: Tag
    tags:
    - Powerdrill
    - Multitool
  - type: ToolTileCompatible
  - type: MultipleTool
    statusShowBehavior: true
    entries:
    - behavior: Prying
      sprite:
        sprite: _IS14/Objects/Specific/Cyborgs/items_cyborg.rsi
        state: toolkit_engiborg_crowbar
      useSound:
        path: /Audio/Items/crowbar.ogg
      changeSound:
        path: /Audio/Items/change_drill.ogg
    - behavior: Anchoring
      sprite:
        sprite: _IS14/Objects/Specific/Cyborgs/items_cyborg.rsi
        state: toolkit_engiborg_wrench
      useSound:
        path: /Audio/Items/ratchet.ogg
      changeSound:
        path: /Audio/Items/change_drill.ogg
    - behavior: Screwing
      sprite:
        sprite: _IS14/Objects/Specific/Cyborgs/items_cyborg.rsi
        state: toolkit_engiborg_screwdriver
      useSound:
        collection: Screwdriver
      changeSound:
        path: /Audio/Items/change_drill.ogg
    - behavior: Cutting
      sprite:
        sprite: _IS14/Objects/Specific/Cyborgs/items_cyborg.rsi
        state: toolkit_engiborg_cutters
      useSound:
        path: /Audio/Items/wirecutter.ogg
      changeSound:
        path: /Audio/Items/change_drill.ogg
    - behavior: Pulsing
      sprite:
        sprite: _IS14/Objects/Specific/Cyborgs/items_cyborg.rsi
        state: toolkit_engiborg_multitool
      changeSound:
        path: /Audio/Items/change_drill.ogg

