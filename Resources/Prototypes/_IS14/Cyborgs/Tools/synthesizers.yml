# A pouring container that fills itself, the base of the condiment synthesiser.
- type: entity
  parent: [IS14BaseCyborgTool, BaseItem]
  id: IS14BaseCyborgCondimentSynth
  abstract: true
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
    layers:
    - state: containers-enzyme
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
  - type: DrainableSolution
    solution: food
  - type: ExaminableSolution
    solution: food
  - type: SolutionTransfer
    canChangeTransferAmount: true
    minTransferAmount: 1
    maxTransferAmount: 30
  - type: UserInterface
    interfaces:
      enum.CyborgReagentUiKey.Key:
        type: CyborgReagentBoundUserInterface

# Given by the condiment synthesiser board, tg's EXPANDED_SERVICE_REAGENTS plus SS14's sauces.
- type: entity
  parent: IS14BaseCyborgCondimentSynth
  id: IS14CyborgToolCondimentSynth
  name: condiment synthesiser
  description: Synthesizes the basics of any kitchen, from flour to hot sauce.
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
  - type: CyborgReagentSynthesizer
    solution: food
    regenAmount: 5
    chargePerUnit: 0.5
    reagents:
    - Flour
    - Sugar
    - TableSalt
    - Blackpepper
    - Rice
    - Cornmeal
    - Oil
    - OilOlive
    - Egg
    - CocoaPowder
    - Butter
    - Vinegar
    - Ketchup
    - Mustard
    - Mayo
    - Soysauce
    - BbqSauce
    - Hotsauce
