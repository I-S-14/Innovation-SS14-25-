# tg's syndicate borghypo: combat medicine.
- type: entity
  parent: [IS14BaseCyborgTool, BorgHypo]
  id: IS14CyborgToolSyndicateHypo
  name: syndicate hypospray
  description: An integrated hypospray loaded with combat medicine.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
      state: syringe-borghypo_s
      map: [ "enum.SolutionContainerLayers.Base" ]
    - sprite: Objects/Specific/Medical/hypospray.rsi
      state: borghypo_fill1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: UserInterface
    interfaces:
      enum.CyborgReagentUiKey.Key:
        type: CyborgReagentBoundUserInterface
  - type: CyborgReagentSynthesizer
    solution: hypospray
    regenAmount: 2
    reagents:
    - Omnizine
    - Bicaridine
    - Kelotane
    - Dexalin
    - Ephedrine

