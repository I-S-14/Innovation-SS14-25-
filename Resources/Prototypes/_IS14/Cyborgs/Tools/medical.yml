# tg's silicon emergency bed: deploys a roller bed where you click, packs it back on click.
- type: entity
  parent: [BaseCyborgTool, BaseItem]
  id: CyborgToolRollerBed
  name: roller bed deployer
  description: A built-in roller bed. Click the floor to deploy it, click the empty bed to pack it back.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
    layers:
    - state: medical_bed-emerg_folded
  - type: Item
    size: Normal
  - type: CyborgBedDeployer

