- type: entity
  parent: [IS14BaseCyborgTool, RCDRecharging]
  id: IS14CyborgToolRCD
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
    layers:
    - state: tools-rcd

- type: entity
  parent: [IS14BaseCyborgTool, RPDRecharging]
  id: IS14CyborgToolRPD
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
    layers:
    - state: tools-rpd

# tg's cyborg welder; the lit sprite sits on the flame layer the toggle visualizer drives.
- type: entity
  parent: [IS14BaseCyborgTool, WelderIndustrial]
  id: IS14CyborgToolWelder
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/items_cyborg.rsi
    layers:
    - state: indwelder_cyborg
    - state: indwelder_cyborg-on
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  # Fuel gauge drawn over the HUD slot only, the welder itself stays clean.
  - type: CyborgHudGauge
    solution: Welder
    sprite: _IS14/Objects/Specific/Cyborgs/items_cyborg.rsi
    states:
    - indwelder_cyborg0
    - indwelder_cyborg25
    - indwelder_cyborg50
    - indwelder_cyborg75
    - indwelder_cyborg100

# Own item: the upstream wirecutters randomize a layer this sprite doesn't have.
# Holds the engineering cyborg's materials now that it carries them instead of synthesizing.
- type: entity
  parent: [IS14BaseCyborgTool, ConstructionBag]
  id: IS14CyborgToolConstructionBag
  categories: [ HideSpawnMenu ]
  components:
  # Click opens the bag, alt click switches the magnet.
  - type: ItemToggle
    onUse: false
    onActivate: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
  - type: CyborgAltToggle

- type: entity
  parent: [IS14BaseCyborgTool, trayScanner]
  id: IS14CyborgToolTrayScanner
  categories: [ HideSpawnMenu ]

- type: entity
  parent: [IS14BaseCyborgTool, GasAnalyzer]
  id: IS14CyborgToolGasAnalyzer
  categories: [ HideSpawnMenu ]

- type: entity
  parent: [IS14BaseCyborgTool, RemoteSignaller]
  id: IS14CyborgToolSignaller
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
    layers:
    - state: new_assemblies-signaller
