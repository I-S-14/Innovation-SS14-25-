  id: IS14CyborgToolPlunger
  categories: [ HideSpawnMenu ]

# Emag tool of the janitor model, tg's lube spray. Refills itself with space lube.
- type: entity
  parent: IS14CyborgToolSprayBottle
  id: IS14CyborgToolLubeSpray
  name: lube spray
  description: A built-in sprayer full of space lube. Not for cleaning.
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
  - type: UserInterface
    interfaces:
      enum.CyborgReagentUiKey.Key:
        type: CyborgReagentBoundUserInterface
  - type: CyborgReagentSynthesizer
    solution: drink
    regenAmount: 5
    reagents:
    - SpaceLube

# Given by the trash bag of holding board.
- type: entity
  parent: IS14CyborgToolTrashBag
  id: IS14CyborgToolTrashBagOfHolding
  name: trash bag of holding
  description: A bluespace trash bag for janitor cyborgs. Holds a lot more.
  categories: [ HideSpawnMenu ]
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,9
