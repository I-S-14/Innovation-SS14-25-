- type: entity
  parent: [IS14BaseCyborgTool, BorgTrashBag]
  id: IS14CyborgToolTrashBag
  categories: [ HideSpawnMenu ]

- type: entity
  parent: [IS14BaseCyborgTool, MopItem]
  id: IS14CyborgToolMop
  categories: [ HideSpawnMenu ]

- type: entity
  parent: [IS14BaseCyborgTool, BorgBucket]
  id: IS14CyborgToolBucket
  categories: [ HideSpawnMenu ]
  components:
  # Comes full: this is the auto-wash tank, water out, mess in.
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 500
        reagents:
        - ReagentId: Water
          Quantity: 500

- type: entity
  parent: [IS14BaseCyborgTool, LightReplacer]
  id: IS14CyborgToolLightReplacer
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
    layers:
    - state: janitor-lightreplacer

- type: entity
  parent: [IS14BaseCyborgTool, HoloprojectorBorg]
  id: IS14CyborgToolHoloprojector
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
    layers:
    - state: tool-signmaker

- type: entity
  parent: [IS14BaseCyborgTool, BorgSprayBottle]
  id: IS14CyborgToolSprayBottle
  categories: [ HideSpawnMenu ]

- type: entity
  parent: [IS14BaseCyborgTool, WireBrush]
  id: IS14CyborgToolWireBrush
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
    layers:
    - state: tools-wirebrush

- type: entity
  parent: [IS14BaseCyborgTool, Plunger]
  id: IS14CyborgToolPlunger
  categories: [ HideSpawnMenu ]

# Emag tool of the janitor model, tg's lube spray. Refills itself with space lube.
- type: entity
  parent: IS14CyborgToolSprayBottle
  id: IS14CyborgToolLubeSpray
  name: lube spray
  description: A built-in sprayer full of space lube. Not for cleaning.
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
  - type: UserInterface
    interfaces:
      enum.CyborgReagentUiKey.Key:
        type: CyborgReagentBoundUserInterface
  - type: CyborgReagentSynthesizer
    solution: drink
    regenAmount: 5
    reagents:
    - SpaceLube

# Given by the trash bag of holding board.
- type: entity
  parent: IS14CyborgToolTrashBag
  id: IS14CyborgToolTrashBagOfHolding
  name: trash bag of holding
  description: A bluespace trash bag for janitor cyborgs. Holds a lot more.
  categories: [ HideSpawnMenu ]
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,9
