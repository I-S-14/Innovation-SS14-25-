  id: IS14CyborgToolTableDock
  name: rolling table dock
  description: A folded serving table. Click the floor to set it up, click the table to fold it back.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/kit_items.rsi
    layers:
    - state: containers-tray
  - type: Item
    size: Normal
  - type: CyborgBedDeployer
    bed: Table
    deployedPopup: cyborg-table-deployed
    packedPopup: cyborg-table-packed
    alreadyDeployedPopup: cyborg-table-already-deployed
