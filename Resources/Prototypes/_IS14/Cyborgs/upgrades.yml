# Ports of tgstation's /obj/item/borg/upgrade boards.

- type: entity
  parent: BaseItem
  id: IS14BaseCyborgUpgrade
  name: cyborg upgrade board
  description: A board that adds new capabilities to a cyborg.
  abstract: true
  components:
  - type: Item
    storedRotation: -90
  - type: Sprite
    sprite: _IS14/Objects/Specific/Cyborgs/robot_items.rsi
  - type: StaticPrice
    price: 100
  - type: GuideHelp
    guides:
    - Cyborgs
    - Robotics

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeReclassification
  name: cyborg reclassification board
  description: Resets the cyborg's model so it can pick a new one. Used up on install.
  components:
  - type: Sprite
    layers:
    - state: module_general
  - type: CyborgUpgrade
    resetModel: true

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeIonThrusters
  name: ion thruster upgrade
  description: Lets the cyborg move without gravity.
  components:
  - type: Sprite
    layers:
    - state: module_general
  - type: CyborgUpgrade
    addComponents:
    - type: MovementIgnoreGravity

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeSelfRepair
  name: self-repair module
  description: Slowly repairs the chassis while the cyborg is active.
  components:
  - type: Sprite
    layers:
    - state: module_general
  - type: CyborgUpgrade
    addComponents:
    - type: PassiveDamage
      allowedStates:
      - Alive
      interval: 2
      damage:
        groups:
          Brute: -1
          Burn: -1

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeIllegal
  name: illegal equipment module
  description: Unlocks the hidden tools of the cyborg's model.
  components:
  - type: Sprite
    layers:
    - state: module_illegal
  - type: CyborgUpgrade
    unlockEmagTools: true

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeDiamondDrill
  name: mining cyborg diamond drill
  description: A diamond drill replacing the mining cyborg's drill and shovel.
  components:
  - type: Sprite
    layers:
    - state: module_miner
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelMiner
    tools:
    - MiningDrillDiamond
    replaces:
    - IS14CyborgToolMiningDrill
    - IS14CyborgToolShovel

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeSatchelOfHolding
  name: mining cyborg satchel of holding
  description: A bluespace ore bag replacing the mining cyborg's satchel.
  components:
  - type: Sprite
    layers:
    - state: module_miner
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelMiner
    tools:
    - OreBagOfHolding
    replaces:
    - IS14CyborgToolOreBag

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeAdvancedMop
  name: janitor cyborg advanced mop
  description: A self-refilling vacuum wand replacing the janitor cyborg's wand.
  components:
  - type: Sprite
    layers:
    - state: module_janitor
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelJanitor
    tools:
    - IS14CyborgToolVacuumWandAdvanced
    replaces:
    - IS14CyborgToolVacuumWand

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeDefibrillator
  name: medical cyborg defibrillator
  description: A built-in defibrillator for medical cyborgs.
  components:
  - type: Sprite
    layers:
    - state: module_medical
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelMedical
    tools:
    - DefibrillatorOneHandedUnpowered

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeAdvancedSurgery
  name: cyborg surgical omni-tool upgrade
  description: Advanced surgical tools for medical cyborgs.
  components:
  - type: Sprite
    layers:
    - state: module_medical
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelMedical
    tools:
    - EnergyScalpel
    - EnergyCautery
    - AdvancedRetractor

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeAdvancedTools
  name: cyborg engineering omni-tool upgrade
  description: Advanced tools for engineering cyborgs.
  components:
  - type: Sprite
    layers:
    - state: module_engineer
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelEngineering
    tools:
    - JawsOfLife
    - PowerDrill
    - WelderExperimental
    replaces:
    - IS14CyborgToolWelder

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeBotanyTools
  name: service cyborg plant bag
  description: A plant bag for service cyborgs. The gardening tools are built into every service cyborg.
  components:
  - type: Sprite
    layers:
    - state: module_service
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelService
    tools:
    - PlantBag

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeRename
  name: cyborg rename board
  description: Write a new name with it in hand, then install it to rename the cyborg. Used up on install.
  components:
  - type: Sprite
    layers:
    - state: module_general
  - type: CyborgUpgrade
  - type: CyborgRenameBoard

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeClown
  name: borg model picker (Clown)
  description: Turns a cyborg into a clown cyborg, honk. Used up on install.
  components:
  - type: Sprite
    layers:
    - state: module_honk
  - type: CyborgUpgrade
    setModel: IS14CyborgModelClown

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeDisablerCooler
  name: cyborg rapid disabler cooling module
  description: Cools the mounted disabler of a security cyborg so it recharges much faster.
  components:
  - type: Sprite
    layers:
    - state: module_security
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelSecurity
    tools:
    - IS14CyborgToolDisablerCooled
    replaces:
    - IS14CyborgToolDisabler

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeTrashBagOfHolding
  name: janitor cyborg trash bag of holding
  description: A bluespace trash bag replacing the janitor cyborg's trash bag.
  components:
  - type: Sprite
    layers:
    - state: module_janitor
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelJanitor
    tools:
    - IS14CyborgToolTrashBagOfHolding
    replaces:
    - IS14CyborgToolTrashBag

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeExpandedHypo
  name: medical cyborg expanded hypospray
  description: Lets the medical cyborg's hypospray synthesize advanced medicines.
  components:
  - type: Sprite
    layers:
    - state: module_medical
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelMedical
    tools:
    - IS14CyborgToolHypoExpanded
    replaces:
    - IS14CyborgToolHypo

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeBluespaceSyringe
  name: advanced syringe
  description: Bluespace technology that expands the capacity of the medical cyborg's syringe.
  components:
  - type: Sprite
    layers:
    - state: module_medical
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelMedical
    tools:
    - IS14CyborgToolSyringeBluespace

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeBeakerApparatus
  name: beaker storage apparatus
  description: A built-in large beaker for medical cyborgs.
  components:
  - type: Sprite
    layers:
    - state: module_medical
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelMedical
    tools:
    - IS14CyborgToolBeaker

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeCrewPinpointer
  name: medical cyborg crew pinpointer
  description: Gives a medical cyborg remote access to the crew monitor.
  components:
  - type: Sprite
    layers:
    - state: module_medical
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelMedical
    - IS14CyborgModelSyndicateMedical
    tools:
    - IS14CyborgToolCrewMonitor

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeGlassApparatus
  name: glass storage apparatus
  description: A drinking glass for service cyborgs.
  components:
  - type: Sprite
    layers:
    - state: module_service
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelService
    tools:
    - IS14CyborgToolDrinkGlass

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeCondimentSynth
  name: service cyborg condiment synthesiser
  description: Lets a service cyborg synthesize flour, sugar, salt, sauces and other condiments.
  components:
  - type: Sprite
    layers:
    - state: module_service
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelService
    tools:
    - IS14CyborgToolCondimentSynth

- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeRollingTable
  name: service cyborg rolling table dock
  description: A folding table for service cyborgs to serve from anywhere.
  components:
  - type: Sprite
    layers:
    - state: module_service
  - type: CyborgUpgrade
    models:
    - IS14CyborgModelService
    tools:
    - IS14CyborgToolTableDock

# tg's borg expander, with BandaStation's 1.25 scale.
- type: entity
  parent: IS14BaseCyborgUpgrade
  id: IS14CyborgUpgradeExpander
  name: borg expander
  description: A cyborg resizer, it makes a cyborg huge.
  components:
  - type: Sprite
    layers:
    - state: module_general
  - type: CyborgUpgrade
    installSound:
      path: /Audio/Items/ratchet.ogg
    addComponents:
    - type: ScaleVisuals
      scale: 1.25, 1.25

# Sold in the uplink in place of the old weapon and martyr modules; fit any model.
- type: entity
  parent: [IS14BaseCyborgUpgrade, BaseSyndicateContraband]
  id: IS14CyborgUpgradeSyndicateWeapon
  name: syndicate weapon cyborg module
  description: Arms any cyborg with an advanced laser pistol and an energy dagger.
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: syndicate
    - state: icon-syndicate
  - type: CyborgUpgrade
    tools:
    - IS14CyborgToolSyndicatePistol
    - IS14CyborgToolSyndicateDagger
  - type: StaticPrice
    price: 2500

- type: entity
  parent: [IS14BaseCyborgUpgrade, BaseSyndicateContraband]
  id: IS14CyborgUpgradeMartyr
  name: martyr cyborg module
  description: Turns any cyborg into a walking bomb. Make sure it is loyal to your cause.
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: syndicateborgbomb
    - state: icon-bomb
  - type: CyborgUpgrade
    tools:
    - IS14CyborgToolMartyr
