# Ports of tgstation's /obj/item/robot_model/*. The kits follow tg; cyborg-only items SS14 lacks
# live in Tools/synthesizers.yml.

- type: cyborgModel
  id: IS14CyborgModelEngineering
  hudIcon: engineer
  name: cyborg-model-engineering
  description: cyborg-model-engineering-desc
  order: 10
  skins:
  - IS14CyborgSkinEngineering
  - IS14CyborgSkinGoobEngineeringAntique
  - IS14CyborgSkinLandmateTreads
  - IS14CyborgSkinGoobEngineeringNoble
  - IS14CyborgSkinCanEngineering
  - IS14CyborgSkinGoobEngineeringRover
  - IS14CyborgSkinSpiderEngineering
  - IS14CyborgSkinGoobEngineeringStandart
  - IS14CyborgSkinEngBot
  - IS14CyborgSkinGoobEngineeringCricket
  - IS14CyborgSkinChiefmate
  radioChannels:
  - Engineering
  basicTools:
  - IS14CyborgToolFlash
  - IS14CyborgToolRCD
  - IS14CyborgToolRPD
  - IS14CyborgToolExtinguisher
  - IS14CyborgToolWelder
  - IS14CyborgToolOmnitool
  - IS14CyborgToolOmnitool
  - IS14CyborgToolTrayScanner
  - IS14CyborgToolGasAnalyzer
  - IS14CyborgToolSignaller
  - IS14CyborgToolSprayPainter
  - IS14CyborgToolConstructionBag
  emagTools:
  - IS14CyborgToolStunArm
  # Materials are carried, not synthesized: picked up into a free slot or kept in the construction bag.
  pickupStacks:
  - Steel
  - MetalRod
  - Plasteel
  - Glass
  - Plasma
  - Uranium
  - Gold
  - Silver
  - Plastic
  - Cable
  - CableMV
  - CableHV
  pickupWhitelist:
    components:
    - FloorTile # floor tiles and carpets
  addComponents:
  - type: MovementIgnoreGravity
  # tg's meson toggle; SS14 mesons only protect eyes, night vision is the closest to seeing the walls.
  - type: NightVision

