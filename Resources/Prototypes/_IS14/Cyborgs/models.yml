# Ports of tgstation's /obj/item/robot_model/*. The kits follow tg; cyborg-only items SS14 lacks
# live in Tools/synthesizers.yml.

- type: cyborgModel
  id: IS14CyborgModelEngineering
  hudIcon: engineer
  name: cyborg-model-engineering
  description: cyborg-model-engineering-desc
  order: 10
  skins:
  - IS14CyborgSkinEngineering
  - IS14CyborgSkinGoobEngineeringAntique
  - IS14CyborgSkinLandmateTreads
  - IS14CyborgSkinGoobEngineeringNoble
  - IS14CyborgSkinCanEngineering
  - IS14CyborgSkinGoobEngineeringRover
  - IS14CyborgSkinSpiderEngineering
  - IS14CyborgSkinGoobEngineeringStandart
  - IS14CyborgSkinEngBot
  - IS14CyborgSkinGoobEngineeringCricket
  - IS14CyborgSkinChiefmate
  radioChannels:
  - Engineering
  basicTools:
  - IS14CyborgToolFlash
  - IS14CyborgToolRCD
  - IS14CyborgToolRPD
  - IS14CyborgToolExtinguisher
  - IS14CyborgToolWelder
  - IS14CyborgToolOmnitool
  - IS14CyborgToolOmnitool
  - IS14CyborgToolTrayScanner
  - IS14CyborgToolGasAnalyzer
  - IS14CyborgToolSignaller
  - IS14CyborgToolSprayPainter
  - IS14CyborgToolConstructionBag
  emagTools:
  - IS14CyborgToolStunArm
  # Materials are carried, not synthesized: picked up into a free slot or kept in the construction bag.
  pickupStacks:
  - Steel
  - MetalRod
  - Plasteel
  - Glass
  - Plasma
  - Uranium
  - Gold
  - Silver
  - Plastic
  - Cable
  - CableMV
  - CableHV
  pickupWhitelist:
    components:
    - FloorTile # floor tiles and carpets
    - Flatpack
    - MachineBoard
    - ComputerBoard
    - StockPart # manipulators, matter bins and the rest
  addComponents:
  - type: MovementIgnoreGravity
  # tg's meson toggle; SS14 mesons only protect eyes, night vision is the closest to seeing the walls.
  - type: NightVision

- type: cyborgModel
  id: IS14CyborgModelMedical
  hudIcon: medical
  name: cyborg-model-medical
  description: cyborg-model-medical-desc
  order: 20
  skins:
  - IS14CyborgSkinMedical
  - IS14CyborgSkinChiefDoctor
  - IS14CyborgSkinGoobMedicalNoble
  - IS14CyborgSkinGoobMedicalQualified
  - IS14CyborgSkinGoobMedicalRover
  - IS14CyborgSkinGoobMedicalMedbot
  - IS14CyborgSkinGoobMedicalAdvanced
  - IS14CyborgSkinGoobMedicalStandart
  - IS14CyborgSkinGoobMedicalCricket
  - IS14CyborgSkinGoobMedicalNeedles
  radioChannels:
  - Medical
  basicTools:
  - IS14CyborgToolFlash
  - IS14CyborgToolHealthAnalyzer
  - IS14CyborgToolHypo
  - IS14CyborgToolDropper
  - IS14CyborgToolMedicalOmnitool
  - IS14CyborgToolMedicalOmnitool
  - IS14CyborgToolBoneGel
  - IS14CyborgToolExtinguisher
  - IS14CyborgToolLollipop
  - IS14CyborgToolChemBag
  - IS14CyborgToolHugModule
  # Treatment, body bags and chemistry are carried, picked up into a free slot or kept in the chem bag.
  pickupWhitelist:
    tags:
    - GlassBeaker
    - PillCanister
    - Syringe
    - Ointment
    - Brutepack
    - Bloodpack
    - Gauze
    - Tourniquet
    - BodyBag
    # Severed limbs and organs, held to carry them or attach them back.
    components:
    - BodyPart
    - Organ
  # Shitmed surgery, like the upstream medical borg: without SurgeryTarget the surgery window shows no steps.
  addComponents:
  - type: Sanitized
  - type: SurgeryTarget
  - type: SurgeryIgnoreClothing
  - type: SurgerySpeedModifier
    speedModifier: 1.5

