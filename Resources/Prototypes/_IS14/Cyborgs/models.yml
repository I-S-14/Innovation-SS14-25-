# Ports of tgstation's /obj/item/robot_model/*. The kits follow tg; cyborg-only items SS14 lacks
# live in Tools/synthesizers.yml.

- type: cyborgModel
  id: CyborgModelEngineering
  hudIcon: engineer
  name: cyborg-model-engineering
  description: cyborg-model-engineering-desc
  order: 10
  skins:
  - CyborgSkinEngineering
  - CyborgSkinGoobEngineeringAntique
  - CyborgSkinLandmateTreads
  - CyborgSkinGoobEngineeringNoble
  - CyborgSkinCanEngineering
  - CyborgSkinGoobEngineeringRover
  - CyborgSkinSpiderEngineering
  - CyborgSkinGoobEngineeringStandart
  - CyborgSkinEngBot
  - CyborgSkinGoobEngineeringCricket
  - CyborgSkinChiefmate
  radioChannels:
  - Engineering
  basicTools:
  - CyborgToolFlash
  - CyborgToolRCD
  - CyborgToolRPD
  - CyborgToolExtinguisher
  - CyborgToolWelder
  - CyborgToolOmnitool
  - CyborgToolOmnitool
  - CyborgToolMultitool
  - CyborgToolTrayScanner
  - CyborgToolGasAnalyzer
  - CyborgToolSignaller
  - CyborgToolSheetSteel
  - CyborgToolSheetGlass
  - CyborgToolRods
  - CyborgToolCableApc
  - CyborgToolCableMV
  - CyborgToolCableHV
  addComponents:
  - type: MovementIgnoreGravity
  # tg's meson toggle; SS14 mesons only protect eyes, night vision is the closest to seeing the walls.
  - type: NightVision

