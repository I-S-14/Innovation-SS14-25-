# The square border of a hyperkinetic dampening field, radius 3, drawn around the cyborg like tg.
# Spawned client side while the dampener is on, follows the cyborg without turning with it.
- type: entity
  id: CyborgDampenerFieldEffect
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _IS14/Effects/dampener_field.rsi
    noRot: true
    drawdepth: Effects
    layers:
    - state: projectile_dampen_northwest
      offset: -3, 3
      shader: unshaded
    - state: projectile_dampen_north
      offset: -2, 3
      shader: unshaded
    - state: projectile_dampen_north
      offset: -1, 3
      shader: unshaded
    - state: projectile_dampen_north
      offset: 0, 3
      shader: unshaded
    - state: projectile_dampen_north
      offset: 1, 3
      shader: unshaded
    - state: projectile_dampen_north
      offset: 2, 3
      shader: unshaded
    - state: projectile_dampen_northeast
      offset: 3, 3
      shader: unshaded
    - state: projectile_dampen_west
      offset: -3, 2
      shader: unshaded
    - state: projectile_dampen_east
      offset: 3, 2
      shader: unshaded
    - state: projectile_dampen_west
