# Xenoborgs on the tgstation-style system. Mirrors upstream BaseXenoborgChassis and xenoborgs.yml:
# the kits are the items of their old modules, the extra modules the mothership prints are upgrade boards.

# Skins
- type: cyborgSkin
  id: IS14CyborgSkinXenoborgEngi
  name: cyborg-skin-xenoborg-engi
  sprite: Mobs/Silicon/chassis.rsi
  bodyState: xenoborg_engi
  eyesState: xenoborg_engi_e
  noMindEyesState: xenoborg_engi_e_r
  lightState: xenoborg_engi_l
  noHat: true

- type: cyborgSkin
  id: IS14CyborgSkinXenoborgHeavy
  name: cyborg-skin-xenoborg-heavy
  sprite: Mobs/Silicon/chassis.rsi
