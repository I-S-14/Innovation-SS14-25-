# Models. Not selectable: the chassis decides.
- type: cyborgModel
  id: IS14CyborgModelXenoborgEngi
  hudIcon: engineer
  name: cyborg-model-xenoborg-engi
  description: cyborg-model-xenoborg-engi-desc
  selectable: false
  skins:
  - IS14CyborgSkinXenoborgEngi
  basicTools:
  # XenoborgModuleBasic
  - IS14CyborgToolXenoXenoborgMaterialBag
  - IS14CyborgToolXenoPinpointerMothership
  - IS14CyborgToolXenoHandheldGPSBasic
  # BorgModuleAdvancedTool
  - IS14CyborgToolXenoJawsOfLife
  - IS14CyborgToolXenoPowerDrill
  - IS14CyborgToolXenoWelderExperimental
  - IS14CyborgToolXenoMultitool
  - IS14CyborgToolXenoRemoteSignallerAdvanced
  - IS14CyborgToolXenoGeigerCounter
  # BorgModuleConstruction
  - IS14CyborgToolSheetSteel
  - IS14CyborgToolSheetGlass
  - IS14CyborgToolRods
