# Models. Not selectable: the chassis decides.
- type: cyborgModel
  id: IS14CyborgModelXenoborgEngi
  hudIcon: engineer
  name: cyborg-model-xenoborg-engi
  description: cyborg-model-xenoborg-engi-desc
  selectable: false
  skins:
  - IS14CyborgSkinXenoborgEngi
  # The engineering cyborg's kit, plus the xenoborg's own modules.
  basicTools:
  - IS14CyborgToolFlash
  - IS14CyborgToolRCD
  - IS14CyborgToolRPD
  - IS14CyborgToolWelder
  - IS14CyborgToolOmnitool
  - IS14CyborgToolOmnitool
  - IS14CyborgToolTrayScanner
  - IS14CyborgToolGasAnalyzer
  - IS14CyborgToolSignaller
  - IS14CyborgToolSprayPainter
  - IS14CyborgToolConstructionBag
  # XenoborgModuleBasic
  - IS14CyborgToolXenoXenoborgMaterialBag
  - IS14CyborgToolXenoPinpointerMothership
  - IS14CyborgToolXenoHandheldGPSBasic
  # XenoborgModuleAccessBreaker and XenoborgModuleFireExtinguisher, the latter in place of the plain one.
  - IS14CyborgToolXenoAccessBreaker
  - IS14CyborgToolXenoSelfRechargingFireExtinguisher
  # Like the engineering model: materials are carried, not synthesized.
  pickupStacks:
  - Steel
  - MetalRod
  - Plasteel
  - Glass
  - Plasma
  - Uranium
  - Gold
  - Silver
  - Plastic
  - Cable
  - CableMV
  - CableHV
  pickupWhitelist:
    components:
    - FloorTile # floor tiles and carpets
    - Flatpack
    - MachineBoard
    - ComputerBoard
    - StockPart # manipulators, matter bins and the rest

