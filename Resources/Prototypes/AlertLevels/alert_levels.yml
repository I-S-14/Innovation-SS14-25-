# IS14: retain Goob alert settings and Corvax announcers.
- type: alertLevel
  id: Green
  name: alert-level-green
  announcement: alert-level-green-announcement
  instructions: alert-level-green-instructions
  color: Green
  emergencyLightColor: LawnGreen
  shuttleTime: 600
  announcersAudio:
    Intern:
      path: /Audio/_CorvaxGoob/Announcements/Announcers/Intern/green.ogg
- type: alertLevel
  id: Blue
  name: alert-level-blue
  announcement: alert-level-blue-announcement
