- type: reagent
  id: Blood
  name: reagent-name-blood
  group: Biological
  desc: reagent-desc-blood
  flavor: metallic
  color: "#800000"
  puddleSpriteSet: Blood # Goob
  metamorphicSprite:
    sprite: Objects/Consumable/Drinks/bloodglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 5
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  recognizable: true
  standsout: true
  physicalDesc: reagent-physical-desc-ferrous
  # IS14: retain Goob organ metabolism and reagent effects.
  metabolisms:
    Drink:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 1.0
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Human]
          inverted: true
    Food:
      effects:
      - !type:AdjustReagent
        reagent: UncookedAnimalProteins
        amount: 0.1
    Medicine:
      effects:
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Bloodsucker]
        damage:
          groups:
            Brute: -3
            Burn: -1.25
  plantMetabolism:
  - !type:PlantAdjustWater
    amount: 0.5
  - !type:DnaImprint
    reagent: Blood
    minScale: 5
    leader: true
    friendly: true
    guidebookText: entity-effect-guidebook-dna-imprint
  footstepSound:
    collection: FootstepBlood
    params:
      volume: 6

