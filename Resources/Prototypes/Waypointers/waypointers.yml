- type: waypointer
  abstract: true
  id: BaseWaypointer
  rsiPath: Markers/Waypointers/waypointer.rsi
  waypointerStates: 5
  color: White

- type: waypointer
  abstract: true
  parent: BaseWaypointer
  id: BaseGridWaypointer
  tracksGrids: true

- type: waypointer
  parent: BaseGridWaypointer
  id: NTStationWaypointer
  name: waypointer-name-station
  trackedComponents:
  - type: StationData
  color: Blue
  radialMenuIconPath: Markers/Waypointers/station_waypointer.rsi
  hideBeyondMaxRange: false

- type: waypointer
  parent: BaseGridWaypointer
  id: TradeStationWaypointer
  name: waypointer-name-trade-station
  trackedComponents:
  - type: TradeStation
  color: Green
  radialMenuIconPath: Markers/Waypointers/trade_station_waypointer.rsi

- type: waypointer
  parent: BaseGridWaypointer
  id: WreckWaypointer
  name: waypointer-name-wreck
  trackedComponents:
  - type: MapGrid
  blacklist:
    components:
    - StationData
    - TradeStation
    - EscapePod
  color: Orange
  maxRange: 50
  radialMenuIconPath: Markers/Waypointers/wreck_waypointer.rsi

- type: waypointer
  parent: BaseWaypointer
  id: DragonRiftWaypointer
  name: waypointer-name-dragon-rift
  trackedComponents:
  - type: DragonRift
    spawn: MobCarpDragon # IS14: Goob rifts retain their separate strong-spawn probability.
  workOnGrid: true
  color: Orange
  maxRange: 50
  radialMenuIconPath: Markers/Waypointers/rift_waypointer.rsi
  hideBeyondMaxRange: false
