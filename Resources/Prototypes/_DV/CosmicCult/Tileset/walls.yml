- type: entity
  parent: BaseWall
  id: WallCosmicCult
  name: malign wall
  description: A strange-looking wall. Staring at it for too long instills a sense of discomfort.
  components:
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-forthecult
  - type: Tag
    tags:
      - Wall
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: cultwalls
    states:
    - !type:CornerSpriteSmoothing
      base: cult
      mask:
      - cultwalls
- type: entity
  parent: WallCosmicCult
  id: WallCosmicCultTrimmed
  name: malign wall
  suffix: Trimmed
  components:
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
    state: full
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
    layers:
    - state: full
  - type: IconSmooth
    key: cultwalls
    states:
    - !type:EdgeSpriteSmoothing
      base: trim_
      mask:
      - cultwalls
      index: '1'
- type: entity
  id: WindowCosmicCult
  name: malign pane
  description: An odd-looking window. Something about it unnerves you.
  # IS14-change: common window behavior and RCD resistance without ordinary-window breakage at 80.
  parent: [BaseWindowStructure, BaseStructureHealth, BaseRCDResistant]
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _DV/CosmicCult/Tileset/cosmicwindow.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwindow.rsi
    state: full
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      base: coswindow
      mask:
      - walls
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: RadiationBlocker
    resistance: 5

- type: entity
  id: WindowCosmicCultDark
  name: malign pane
  suffix: Tinted
  parent: WindowCosmicCult
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_dark.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_dark.rsi
    state: full
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      base: cosDwindow
      mask:
      - walls
