# IS14-change: the inactive circle keeps 25 health; upgraded stages use the common base.
- type: entity
  id: RitualCircleInact
  parent: IS14RitualCircleBaseCommon
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak

- type: entity
  id: RitualCircle1
  parent: IS14RitualCircleBaseCommon # IS14-change: keep this stage's own health.
  components:
  - type: Sprite
    sprite: /Textures/_Goobstation/Wraith/Objects/ritualcircle.rsi
    layers:
    - state: harbinger_circle_1
  - type: PointLight
    radius: 1
    netsync: false
    energy: 5
    color: "#ebb02b"
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 30
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: GlassBreak

