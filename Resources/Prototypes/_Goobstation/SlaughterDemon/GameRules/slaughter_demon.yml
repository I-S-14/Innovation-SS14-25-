# major
- type: entity
  parent: BaseGameRule
  id: SlaughterDemonSummon
  components:
  - type: AntagSpawner
    prototype: BaseMobSlaughterDemon
  - type: AntagSelection
    agentName: slaughter-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: IS14SlaughterDemonSummonAntag0fa932dba
      range:
        max: 1
        min: 1
      playerRatio: 10
  - type: AntagRandomSpawn
  - type: AntagObjectives
    objectives:
      # - SlaughterKillTheWizardObjective
      - SlaughterKillEveryoneObjective

# laughter
- type: entity
  parent: BaseGameRule
  id: LaughterDemonSummon
  components:
  - type: AntagSpawner
    prototype: MobLaughterDemon
  - type: AntagSelection
    agentName: laughter-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: IS14LaughterDemonSummonAntag0005945d5
      range:
        max: 1
        min: 1
      playerRatio: 10
  - type: AntagRandomSpawn
  - type: AntagObjectives
    objectives:
    - SlaughterHugAndTickleObjective

# midround
- type: entity
  parent: BaseGameRule
  id: SlaughterDemonMidround
  components:
  - type: AntagSelection
    agentName: lesser-slaughter-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: IS14SlaughterDemonMidroundAntag000b041f6
      range:
        max: 1
        min: 1
      playerRatio: 10
  - type: AntagRandomSpawn
  - type: AntagSpawner
    prototype: MobLesserSlaughterDemon
  - type: StationEvent
    weight: 1
    earliestStart: 30
    minimumPlayers: 50
    duration: null
    maxOccurrences: 1
    chaos:
      Hostile: 200
      Friend: 40
      Medical: 200
      Death: 200
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 900
  - type: Tag
    tags:
    - MidroundAntag
  - type: AntagObjectives
    objectives:
      - SlaughterDevourObjective
      - AnnihilateAllJanitorsObjectiveFluff
      - SpareCrewObjectiveFluff
      - HuntTheBraveObjectiveFluff
      - HuntTheCowardsObjectiveFluff
      - ShowCrewPowerObjectiveFluff
      - DriveInsaneObjectiveFluff
      - SpreadBloodObjectiveFluff
