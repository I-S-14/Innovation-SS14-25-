- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseWizardRule
  components:
  - type: WizardRule
  - type: GameRule
    minPlayers: 30
    chaosScore: 900
  - type: AntagObjectives
    objectives:
    - WizardSurviveObjective
  - type: AntagSelection
    useCharacterNames: true
    selectionTime: PrePlayerSpawn
    agentName: wizard-roundend-name
    antags:
    - !type:LinearAntagCount
      proto: IS14BaseWizardRuleAntag03a989a8f
      range:
        max: 1
        min: 1
      playerRatio: 20
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    - Yowie # Penalized by wearing robes, still should be possible to select them in magic mirror.
    - Plasmaman # EE
    - Synth
  - type: RuleGrids
  - type: LoadMapRule
    mapPath: /Maps/_Goobstation/Nonstations/wizden.yml
  - type: Tag
    tags:
      - RoundstartAntag

- type: entity
  parent: BaseWizardRule
  id: Wizard

- type: entity
  parent: BaseWizardRule
  id: WizardMidround
  components:
  - type: StationEvent
    earliestStart: 35
    weight: 4 # CorvaxGoob-SpawnRebalance: Changed to from 5.5
    minimumPlayers: 20
    duration: 1
    chaos: # Goobstation
      Hostile: 200
      Friend: 40
      Medical: 200
      Death: 200
  - type: AntagSelection
    useCharacterNames: true
    selectionTime: RuleStarted
    antags:
    - !type:LinearAntagCount
      proto: IS14WizardMidroundAntag001b3cc92
      range:
        max: 1
        min: 1
      playerRatio: 20
  - type: Tag
    tags:
      - MidroundAntag

- type: entity
  parent: BaseGameRule
  id: ApprenticeRule
  components:
  - type: GameRule
  - type: AntagSelection
    useCharacterNames: true
    selectionTime: RuleStarted
    agentName: apprentice-roundend-name
    antags:
    - !type:LinearAntagCount
      proto: IS14ApprenticeRuleAntag04a5038e2
      range:
        max: 1
        min: 1
      playerRatio: 1
- type: entity
  parent: BaseGameRule
  id: SleepersOnWizardDeath
  components:
  - type: RuleOnWizardDeathRule
    rule: SleeperAgentsWizard

- type: entity
  parent: BaseTraitorRule
  id: SleeperAgentsWizard
  components:
  - type: StationEvent
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: IS14SleeperAgentsWizardAntag0497a9236
      range:
        max: 6
        min: 4
      playerRatio: 10
- type: entity
  parent: BaseGameRule
  id: GhostsVisible
  components:
  - type: GhostsVisibleRule

- type: entity
  parent: BaseGameRule
  id: GlobalTileMovement
  components:
  - type: GlobalTileMovementRule

- type: gamePreset
  id: Wizard
  alias:
    - wiz
  name: wizard-title
  description: wizard-description
  showInVote: false
  rules:
    - Wizard
    - SleepersOnWizardDeath
    - BasicStationEventScheduler
    - SpaceTrafficControlEventScheduler
    - BasicRoundstartVariation
    - SubGamemodesRule
