- type: entity
  id: HolosignSecurityAdvanced
  parent: BaseHoloSign # IS14-change: keep the barrier's own 100 health instead of the sign's 30.
  name: advanced holographic barrier
  description: An advanced barrier of hard light that blocks movement. You can't crawl under this one.
  components:
  - type: Tag # IS14-change: retain the tag previously inherited from HolosignWetFloor.
    tags:
    - Holosign
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Sprite
    sprite: _Goobstation/Structures/Holo/field.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: TimedDespawn
    lifetime: 180
  - type: PointLight
    enabled: true
    radius: 3
    color: red
  - type: Clickable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
