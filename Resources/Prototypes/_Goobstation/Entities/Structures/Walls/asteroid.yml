- type: entity
  id: MeteorRockBSCrystal
  parent: AsteroidRock
  suffix: bluespace crystal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: OreBSCrystal
    - type: Sprite
      layers:
      - state: rock_asteroid
      - state: rock_bluespace_crystal
        sprite: Structures/Walls/rock.rsi
        map: ["enum.MiningScannerVisualLayers.Overlay"]
        visible: 'false'
    - type: IconSmooth
      key: walls
      states:
      - !type:EdgeSpriteSmoothing
        base: rock_asteroid_
        mask:
        - walls
        index: '1'
