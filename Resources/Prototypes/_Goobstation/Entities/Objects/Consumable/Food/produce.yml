- type: entity
  name: strange berries
  parent: FoodProduceBase
  id: FoodStrangeBerries
  description: A handful of strange berries.
  components:
  - type: FlavorProfile
    flavors:
      - metallic
      - berry
  - type: Solution
    solution:
      maxVol: 11
      reagents:
      - ReagentId: Artifexium
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 4
      temperature: 293.15
      canReact: true
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Hydroponics/strange_berries.rsi
  - type: Produce
    plantId: IS14StrangeBerrySeedsPlant
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Artifexium
        Quantity: 5

- type: entity
  name: nevcotta log
  description: When planted out of it's native habitat, it grows into an entirely different plant.
  id: Nevcotta
  parent: ProduceBase
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Hydroponics/nevcotta.rsi
    state: icon
  - type: SolutionContainerManager
  - type: Produce
    plantId: TowercapPlants # Shhh, I don't want to make this an actual plant yet!
  - type: ToolRefinable
    qualityNeeded: Slicing
    refineTime: 0
    refineFuel: 0
    refineResult:
    - id: NevcottaBark
      amount: 2
    verbText: refined-slice-verb-name
    tooltipQualityHint: tool-refinable-component-hint-slicing
- type: entity
  name: nevcotta bark
  description: The bark of a Nevcotta tree.
  id: NevcottaBark
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Hydroponics/nevcotta.rsi
    state: bark
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: NevcottaPowder
          Quantity: 5
        - ReagentId: Fiber
          Quantity: 4


- type: entity
  name: bluespace tomato
  parent: FoodBlueTomato
  id: FoodBluespaceTomato
  description: Be careful with it.
  components:
  - type: SwapTeleportOnThrow
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Singulo
        Quantity: 5
      canReact: false
      temperature: 293.15
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Hydroponics/bluespace_tomato.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    plantId: IS14BluespaceTomatoSeedsPlant
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: Singulo
        Quantity: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:SpillBehavior
        solution: food
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - Fruit
    - Vegetable
