- type: entity
  name: flamin hot cotton pizza
  parent: FoodPizzaBase
  id: FoodPizzaCottonHot
  description: Flat fabric cotton dough with super spicy cotton topping. Flamin hot!
  components:
  - type: FlavorProfile
    flavors:
    - cotton
    - bread
    - spicy
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/cotton-pizza-hot.rsi
    state: cotton-pizza-hot
  - type: Edible
    requiresSpecialDigestion: true
  - type: ToolRefinable
    qualityNeeded: Slicing
    refineTime: 1
    refineFuel: 0
    refineResult:
    - id: FoodPizzaCottonHotSlice
      amount: 5
    verbText: refined-slice-verb-name
    tooltipQualityHint: tool-refinable-component-hint-slicing
    sound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: ToolRefinableSolution
  - type: Tag
    tags:
    - ClothMade
    - Pizza
  - type: Solution
    solution:
      maxVol: 40
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Vitamin
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
      - ReagentId: CapsaicinOil
        Quantity: 5
      temperature: 293.15
      canReact: true

- type: entity
  name: slice of flamin hot cotton pizza
  parent: FoodPizzaSliceBase
  id: FoodPizzaCottonHotSlice
  description: A slice of hot cotton pizza. Extra spicy!
  components:
  - type: FlavorProfile
    flavors:
    - cotton
    - bread
    - spicy
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/cotton-pizza-hot.rsi
    state: cotton-slice-hot
  - type: Item
    heldPrefix: cotton-slice-hot
  - type: Tag
    tags:
    - ClothMade
    - Pizza
    - Slice
  - type: Solution
    solution:
      maxVol: 6
      reagents:
      - ReagentId: Nutriment
        Quantity: 3.5
      - ReagentId: Vitamin
        Quantity: 0.8
      - ReagentId: Fiber
        Quantity: 1
      - ReagentId: CapsaicinOil
        Quantity: 0.5
      temperature: 293.15
      canReact: true
