- type: entity
  parent: BaseFoodCondimentPacket
  id: FoodCondimentPacketProtein
  name: protein powder packet
  description: Contains 10u of powdered protein. Mix with 20u of water
  components:
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Protein
        Quantity: 10
      temperature: 293.15
      canReact: true
  - type: Icon
    state: packet-greygoo
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: packet-solid-

- type: entity
  name: block of freedom cheese
  parent: FoodBakingBase
  id: FoodFreedomCheeseBlock
  description: A solid block of artery-clogging cheese based on an questionable old world recipe. Slice it for your buddies.. or just eat the entire block for yourself, you weirdo.
  components:
  - type: FlavorProfile
    flavors:
      - creamy
      - cheesy
    ignoreReagents:
      - Nutriment
      - GastroToxin
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/freedom_cheese.rsi
    state: cheese_block
  - type: Solution
    solution:
      maxVol: 28
      reagents:
      - ReagentId: Nutriment
        Quantity: 16
      - ReagentId: GastroToxin
        Quantity: 4
      temperature: 293.15
      canReact: true
  - type: ToolRefinable
    qualityNeeded: Slicing
    refineTime: 1
    refineFuel: 0
    refineResult:
    - id: FoodFreedomCheeseSlice
      amount: 4
    verbText: refined-slice-verb-name
    tooltipQualityHint: tool-refinable-component-hint-slicing
    sound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: ToolRefinableSolution
- type: entity
  name: freedom cheese slice
  parent: FoodBakingBase
  id: FoodFreedomCheeseSlice
  description: Highly questionable amalgamation of cheddar, fillers and the spirit of freedom. NanoTrasen's healthcare does not cover incidents regarding the consumption of this item.
  components:
  - type: FlavorProfile
    flavors:
      - creamy
      - cheesy
    ignoreReagents:
      - Nutriment
      - GastroToxin
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/freedom_cheese.rsi
    state: cheese_slice
  - type: Solution
    solution:
      maxVol: 7
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
      - ReagentId: GastroToxin
        Quantity: 1
      temperature: 293.15
      canReact: true
  - type: Tag
    tags:
    - Slice
  - type: FoodSequenceElement
    entries:
      Burger: FSE_FoodFreedomCheeseSlice
