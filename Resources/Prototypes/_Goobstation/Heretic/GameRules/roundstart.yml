  - type: GameRule
    minPlayers: 15
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
    - HereticSacrificeObjective
    - HereticSacrificeHeadObjective
  - type: AntagSelection
    selectionTime: JobsAssigned
    agentName: heretic-roundend-name
    antags:
    - !type:LinearAntagCount
      proto: IS14CalmHereticAntag0c17a9c3a
      range:
        max: 2
        min: 1
      playerRatio: 20
    lateJoinAdditional: true
  - type: Tag
    tags:
      - CalmAntag
