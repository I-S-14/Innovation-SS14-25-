- type: entity
  parent: BaseGameRule
  id: Heretic
  components:
  - type: HereticRule
  - type: GameRule
    minPlayers: 15
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
    - HereticSacrificeObjective
    - HereticSacrificeHeadObjective
  - type: AntagSelection
    selectionTime: JobsAssigned
    agentName: heretic-roundend-name
    antags:
    - !type:LinearAntagCount
      proto: IS14HereticAntag06078a414
      range:
        max: 3
        min: 1
      playerRatio: 15
      chaosScore: 250
    lateJoinAdditional: true
  - type: Tag
    tags:
      - RoundstartAntag

- type: entity
