    - OperationSuffixHonkops
    nameFormat: name-format-standard
  - type: NukeopsRule
    localePrefix: "honkops-"
  - type: LoadMapRule
    mapPath: /Maps/_Goobstation/Nonstations/nukieplanet-honkops.yml
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    antags:
    - !type:LinearAntagCount
      proto: IS14HonkopsAntag05768b065
      range:
        max: 1
        min: 1
      playerRatio: 10
      chaosScore: 300
    - !type:LinearAntagCount
      proto: IS14HonkopsAntag1f63b0e07
      range:
        max: 1
        min: 1
      playerRatio: 10
      chaosScore: 300
    - !type:LinearAntagCount
      proto: IS14HonkopsAntag2142d62bc
      range:
        max: 10
        min: 1
      playerRatio: 16
      chaosScore: 300
