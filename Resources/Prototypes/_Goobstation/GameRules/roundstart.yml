# SubGamemodes

- type: entity
  parent: BaseGameRule
  id: TraitorSubGamemodesRule
  components:
  - type: SubGamemodes
    rules:
    - id: SubgamemodeTraitor
      prob: 0.5

# GameModes

- type: entity
  parent: BaseGameRule
  id: Changeling
  components:
  - type: ChangelingRule
  - type: GameRule
    minPlayers: 15
  - type: AntagRandomObjectives
    sets:
    - groups: ChangelingObjectiveGroups
    maxDifficulty: 5
  - type: AntagObjectives
    objectives:
    - ChangelingSurviveObjective
    - ChangelingStealDNAObjective
    - ChangelingAbsorbObjective
    - EscapeIdentityObjective
  - type: AntagSelection
    selectionTime: JobsAssigned
    agentName: changeling-roundend-name
    antags:
    - !type:LinearAntagCount
      proto: IS14ChangelingAntag0e1ef2b1d
      range:
        max: 4
        min: 1
      playerRatio: 12
      chaosScore: 200
    lateJoinAdditional: true
  - type: Tag
    tags:
      - RoundstartAntag

- type: entity
  parent: BaseTraitorRule
  id: CorporateAgent
  components:
  - type: TraitorRule
    objectiveIssuers: CorporateFlavor
  - type: AntagRandomObjectives
    sets:
    - groups: CorporateObjectiveGroups
    maxDifficulty: 8 # Very rare antag so they should get a lot of objectives
  - type: GameRule
    minPlayers: 30
    delay:
      min: 465
      max: 665 # Delay is so the heads help their department get set up.
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: IS14CorporateAgentAntag0de0f8229
      range:
        max: 2
        min: 1
      playerRatio: 25
      chaosScore: 300
    lateJoinAdditional: true
