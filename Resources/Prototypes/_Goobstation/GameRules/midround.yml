- type: entity
  parent: Traitor
  id: TraitorMidround
  components:
  - type: StationEvent
    earliestStart: 30
    weight: 8
    minimumPlayers: 15
    maxOccurrences: 1
    startAnnouncement: station-event-communication-interception
    startAudio:
      path: /Audio/Announcements/intercept.ogg
    announcersStartAudio: # CorvaxGoob-CustomAnnouncers
      Intern:
        path: /Audio/_CorvaxGoob/Announcements/Announcers/Intern/intercept.ogg
    duration: null
    occursDuringRoundEnd: false
    chaos:
      Hostile: 100
      Medical: 100
      Death: 100
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 400
  - type: AlertLevelInterceptionRule
  - type: AntagSelection
    selectionTime: RuleStarted
    antags:
    - !type:LinearAntagCount
      proto: IS14TraitorMidroundAntag09fce3309
      range:
        max: 2
        min: 1
      playerRatio: 10
    lateJoinAdditional: true
  - type: Tag
    tags:
      - MidroundAntag

