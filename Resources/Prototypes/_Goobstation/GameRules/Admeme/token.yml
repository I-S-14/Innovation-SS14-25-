# These are the gamerules to spawn antags for tokens.
- type: entity
  parent: NinjaSpawn
  id: TokenNinjaSpawn
  components:
  - type: StationEvent
    isSelectable: false
  - type: AntagSelection
    agentName: ninja-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: IS14TokenNinjaSpawnAntag0b49305ce
      range:
        max: 1
        min: 1
      playerRatio: 10
