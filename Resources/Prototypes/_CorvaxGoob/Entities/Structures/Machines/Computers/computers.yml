- type: entity
  parent: BaseComputerAiAccess
  id: NuclearReactorMonitor
  name: nuclear reactor monitor
  description: A device that monitors the state of a connected nuclear reactor.
  components:
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#c9c042"
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["enum.ComputerVisualLayers.Frame"]
      state: computer
    - map: ["enum.ComputerVisualLayers.Screen"]
      state: power_monitor
  - type: ComputerVisuals # IS14: retain the custom states with modern layer keys.
    stateFrame: computer
    stateKeyboard: null
    stateScreen: power_monitor
    stateKeys: null
    statePanel: null
  - type: NuclearReactorMonitor
  - type: ActivatableUI
    key: enum.NuclearReactorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NuclearReactorUiKey.Key:
        type: NuclearReactorBoundUserInterface
  - type: AccessReader
    access: [["Engineering"]]
  - type: Lock
    unlockOnClick: false
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: DeviceLinkSink
    ports:
      - NuclearReactorDataReceiver
  - type: Computer
    board: NuclearReactorMonitorComputerCircuitboard
  - type: ContainerContainer
    containers:
      board: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container

