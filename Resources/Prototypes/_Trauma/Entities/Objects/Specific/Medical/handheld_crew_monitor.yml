- type: entity
  parent: [ BaseSyndicateContraband, HandheldCrewMonitor ]
  id: SyndiCrewMonitor
  name: syndicate crew monitor
  description: The syndicated version of crew monitor, intercepts information from the server.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/syndihandheldcrewmonitor.rsi
    # IS14-change: this RSI has one animated state, not the new base/screen layers.
    layers:
    - state: syndiscanner
  - type: Item
    sprite: Objects/Specific/Medical/handheldcrewmonitor.rsi # IS14-change: valid scanner in-hands.
  - type: GenericVisualizer
    visuals: {} # IS14-change: preserve the original always-animated Syndicate icon.
  - type: PowerCellDraw
    useCharge: 0

- type: entity
  parent: SyndiCrewMonitor
  id: SyndiCrewMonitorEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
