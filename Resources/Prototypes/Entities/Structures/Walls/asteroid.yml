#region Wall Rock

# Rocks and ore veins
- type: entity
  parent: [ BaseWall, StructureHealthWallWeak ]
  id: WallRock
  name: rock
  suffix: planetmap
  components:
  - type: Transform
    noRot: true
  - type: SoundOnGather
  - type: Gatherable
    toolWhitelist:
      tags: [] # Lavaland Change
      #- Pickaxe
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock # Lavaland Change
  - type: Destructible
    thresholds:
    # Lavaland Change start
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    # Lavaland Change end
  - type: IconSmooth
    key: stone
    states:
    - !type:CornerSpriteSmoothing
      mask: [ stone, doors ]
      base: stone
      index: 0
  - type: Icon
    sprite: Structures/Walls/stone-dirt.rsi
    state: full
  - type: MiningScannerViewable
  - type: Sprite
    sprite: Structures/Walls/stone-dirt.rsi

# Ore veins
- type: entity
  parent: [ BaseVeinCoal, WallRock ]
  id: WallRockCoal
  components:
  - type: EntityRemap
    mask:
      AsteroidRock: AsteroidRockCoal
      WallRockChromite: WallRockChromiteCoal
      WallRockSand: WallRockSandCoal
      WallRockSnow: WallRockSnowCoal
  - type: Sprite
    layers:
    - state: rock_coal
      sprite: Structures/Walls/stone-ore.rsi
