  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: OreSteel
    - type: Sprite
      layers:
      - state: rock_tin
        sprite: Structures/Walls/stone-ore.rsi
        map: ["enum.MiningScannerVisualLayers.Overlay"]
        visible: 'false'
  id: WallRockChromiteTin

