- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseStructureWall
  name: basewall
  description: Keeps the air in and the greytide out.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MetalBulletImpact
    soundTypes:
      Heat:
        collection:
          MetalLaserImpact
  - type: Wall
  - type: IsRoof
  - type: Sprite
    drawdepth: Walls
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Airtight
  - type: StaticPrice
    price: 75
  - type: RadiationBlocker # CorvaxGoob Radiation Overhaul Revert
    resistance: 2
  - type: BlockWeather
  - type: SunShadowCast
  # <Goobstation>
  - type: Penetratable
    penetrateDamage: 50
    damagePenalty: 0.1
  - type: ExaminableDamage
    messages: WindowMessages
  # </Goobstation>
  - type: TrayScanReveal

- type: entity
  abstract: true
  parent: BaseStructureWall
  id: BaseWall
  components:
  - type: Occluder # Breaks on diagonal walls
  - type: PlacementReplacement
    key: walls
  - type: StructureAlignerPylon
    pylons:
    - Door
    - Firelock

- type: entity
  abstract: true
  parent: BaseStructureWall
  id: WallDiagonalBase
  suffix: Diagonal
  components:
  - type: Tag
    tags:
    - Diagonal
  - type: IconSmooth
    key: walls
    states:
    - !type:DiagonalSpriteSmoothing
      mask:
      - walls
      - windows
      - grilles
      - marble
      - doors
      base: state
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: Occluder
    polygon:
    - "-0.5,-0.5"
    - "0.5,0.5"
    - "0.5,-0.5"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
          vertices:
          - "-0.5,-0.5"
          - "0.5,0.5"
          - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer

- type: entity
  parent: [ BaseWall, StructureHealthWallWeak ]
  id: WallBrick
  name: brick wall
  components:
  - type: Sprite
    sprite: Structures/Walls/brick.rsi
  - type: Icon
    sprite: Structures/Walls/brick.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger: &DamageWallWeak
        !type:DamageTrigger
        damage: 150
      behaviors:
      - &SoundBreakStone !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - &SpawnGirder !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          Girder:
            min: 1
            max: 1
  - type: IconSmooth
    key: walls-material
    states:
    - !type:CornerSpriteSmoothing
      mask:
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-plasma-reinf
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-shuttle
      - windows-plastitanium
      - windows-regal
      - walls-exo
      - walls-shuttle
      - walls-plastitanium
      - walls-material
      - walls-marble
      - walls
      - grilles
      - doors
      base: brick
  - type: RustRequiresPathStage # Goobstation
    pathStage: 4 # Mark of rust
  - type: CosmicCorruptible # DeltaV - Cosmic Cult
    convertTo: WallCosmicCult

- type: entity
  parent: BaseWall
