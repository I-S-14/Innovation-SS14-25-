# These define Meteor Walls separate from Asteroid walls so they have different properties

# Ore veins
- type: entity
  id: MeteorRockCoal
  parent: MeteorRock
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: OreCoal
    - type: Sprite
      layers:
      - state: rock_asteroid
      - state: rock_coal
        sprite: Structures/Walls/stone-ore.rsi
    - type: IconSmooth
      key: walls
      states:
      - !type:EdgeSpriteSmoothing
        base: rock_asteroid_
        mask:
        - walls
        index: '1'
