- type: entity
  abstract: true
  # IS14-change: share locker mechanics without forcing the weak 60-damage threshold
  # onto retained secure variants. Ordinary LockerBase below keeps its original health.
  parent: [ ClosetBase, BaseStructureHealth ]
  id: IS14LockerBaseCommon
  components:
  - type: AccessReader
  - type: Lock
  - type: LockVisuals
  - type: Sprite
    sprite: Structures/Storage/closet.rsi
    noRot: true
    layers:
    - state: generic
      map: ["enum.StorageVisualLayers.Base"]
    - state: generic_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: Construction
    graph: ClosetSteelSecure
    node: done
    containers:
    - entity_storage
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 125
  - type: RecyclableOnUnlock
  - type: Paintable
    group: Locker
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: StaticPrice
    price: 300

- type: entity
  abstract: true
  parent: [ IS14LockerBaseCommon, StructureHealthContainerWeak ]
  id: LockerBase
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
