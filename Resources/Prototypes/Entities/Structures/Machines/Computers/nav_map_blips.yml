# All consoles

- type: navMapBlip
  id: NavMapConsole
  blinks: true
  color: Cyan
  texturePaths:
  - "/Textures/Interface/NavMap/beveled_circle.png"


# Atmos monitoring console
- type: navMapBlip
  id: GasPipeSensor
  selectable: true
  color: "#ffcd00"
  texturePaths:
  - "/Textures/Interface/NavMap/beveled_star.png"
  placement: Offset


- type: navMapBlip
  id: GasVentOpening
  scale: 0.75
  color: LightGray
  texturePaths:
  - "/Textures/Interface/NavMap/beveled_square.png"


- type: navMapBlip
  id: GasVentScrubber
  components:
    - type: VentCrawlerTube # Goobstation - ventcrawl
      containerId: VentCrawlerTube
    - type: VentCrawlerEntry  # Goobstation - ventcrawl
    - type: ContainerContainer # Goobstation - ventcrawl
      containers:
        VentCrawlerTube: !type:Container
    - type: ApcPowerReceiver
    - type: ExtensionCableReceiver
    - type: DeviceNetwork
      prefix: device-address-prefix-scrubber
    - type: Tag
      tags:
        - GasScrubber
        - Unstackable
    - type: SubFloorHide
      visibleLayers:
      - enum.SubfloorLayers.FirstLayer
    - type: Sprite
      drawdepth: FloorObjects
      sprite: Structures/Piping/Atmospherics/scrubber.rsi
      noRot: true
      layers:
        - sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeUnaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: scrub_off
          map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]
    - type: Appearance
    - type: PipeColorVisuals
    - type: GenericVisualizer
      visuals:
        enum.ScrubberVisuals.State:
          enabled:
            Off: { state: scrub_off }
            Scrub: { state: scrub_on }
            Siphon: { state: scrub_purge }
            WideScrub: { state: scrub_wide }
            Welded: { state: scrub_welded }
    - type: AtmosDevice
    - type: GasVentScrubber
    - type: Construction
      graph: GasUnary
      node: ventscrubber
    - type: AmbientSound
      enabled: true
      volume: -12
      range: 5
      sound:
        path: /Audio/Ambience/Objects/gas_vent.ogg
    - type: Weldable
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasVentScrubber
    - type: VentCritterSpawnLocation # DeltaV
    - type: GuideHelp
      guides:
      - AirScrubber
      - DeviceMonitoringAndControl
  scale: 0.75
  color: LightGray
  texturePaths:
  - "/Textures/Interface/NavMap/beveled_circle.png"


