- type: entity
  parent: MobSpiderBase
  id: MobGiantSpiderWizard
  name: wizard spider
  suffix: Wizard
  description: This spider looks a little magical
  components:
  - type: LanguageKnowledge # Einstein Engines - Language
    speaks:
    - Universal # Should allow them to understand everything and speak it too. Might need to change this.
    understands:
    - Universal
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Animals/Spiders/tarantulaspider.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: idle
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 6
