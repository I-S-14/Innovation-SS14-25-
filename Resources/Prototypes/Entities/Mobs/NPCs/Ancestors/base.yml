- type: entity
  abstract: true
  parent: [ BaseMobAnimal, SimpleMobBase, StripableInventoryBase, BaseMobDestructible, BaseMobDisgust ]
  id: MobBaseAncestor
  name: genetic ancestor
  description: The genetic bipedal ancestor of... Uh... Something. Yeah, there's definitely something on the station that descended from whatever this is.
  components:
  - type: Blindable # monkeys can be blind while sleeping!
  - type: VentCrawler # goobstation - Ventcrawl
    allowInventory: false
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: monkey
      sprite: Mobs/Animals/Ancestors/monkey.rsi
    - map: [ "jumpsuit" ]
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "ears" ]
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "mask" ]
    - map: [ "head" ]
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Monkey_burning
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Inventory
    templateId: monkey
    speciesId: monkey
  - type: Hands
    startingHands:
      hand_left:
        location: Left
  - type: Cuffable
  - type: Stripping
  - type: ComplexInteraction
  - type: GenericVisualizer
    visuals:
      enum.CreamPiedVisuals.Creamed:
        clownedon:
          True: {visible: true}
          False: {visible: false}
      enum.ToggleableVisuals.Enabled: # Goobstation - Skinnable monkey
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Body # Shitmed Change
    bodyType: Complex
    prototype: Monkey
    requiredLegs: 2
  - type: CombatMode
    canDisarm: true
  # Shitmed Change Start
  - type: Targeting
  - type: HumanoidAppearance
    species: Monkey
  # Shitmed Change End
  - type: CosmicCenserTarget # DeltaV - Cosmic Cult
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 30
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 3
        Piercing: 3
  - type: Puller
    needsHands: false
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 3
  - type: Deathgasp
    prototype: MonkeyDeathgasp
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_monkey
  - type: InteractionPopup
    successChance: 0.9
    interactSuccessString: petting-success-monkey
    interactFailureString: petting-failure-monkey
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/ferret_happy.ogg
    interactFailureSound:
      path: /Audio/Items/wirecutter.ogg
  - type: IdExaminable
  - type: Tag
    tags:
    - VimPilot
    - DoorBumpOpener
    - AnomalyHost
    - XenobioSlimeFavoriteFood # Goobstation
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
  - type: Vocal # Goobstation
    sounds:
      Male: MonkeyMode
      Female: MonkeyMode
      Unsexed: MonkeyMode
    wilhelmProbability: 0.001
  - type: Consciousness
    hasPainScreams: false
    threshold: 70
    cap: 140
  - type: Crawler
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: DiseaseCarrier # Goobstation
  - type: XenovacTarget # Goobstation - Xenobio
  - type: JobStatus # marks them as crew
  - type: CanHostGuardian
  - type: FactionException
  - type: NpcFactionMember
    factions:
      - Passive
      - Monkey  # Goob Balloons Edit
  - type: NPCRetaliation
    attackMemoryLength: 10
  # Goobstation
  - type: GroupRetaliation
    range: 8
  - type: HTN
    rootTask:
      task: MonkeyCompound
    blackboard:
      NavInteract: !type:Bool
        true
