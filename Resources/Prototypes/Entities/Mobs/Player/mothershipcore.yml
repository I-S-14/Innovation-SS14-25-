- type: entity
  parent: [ BaseControllable, BaseStructure, StructureHealthMachineStrong ]
  id: MothershipCore
  name: mothership core
  description: A sentient machine that can produce Xenoborgs. Without this the Xenoborgs are doomed.
  components:
  - type: VoiceChatEffect # Goobstation - Voice chat
    effect: Robot
  - type: InputMover # needs this to pilot the mothership
  #IS14-change start - the body is stationary; movement can be relayed to the remote eye.
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: MothershipEye
  - type: Cyborg
    model: IS14CyborgModelMothership
    defaultSkin: IS14CyborgSkinMothership
    manageAppearance: false
    canOpenSelfUi: true
    inherentRadioChannels: [Mothership, Xenoborg, Binary]
  - type: PowerCellDraw
    drawRate: 0.6
    enabled: false
  #IS14-change end
  - type: Appearance
  - type: WiresVisuals
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Mobs/Silicon/mothership_core.rsi
    layers:
    - state: core-idle
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: core-load
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: core-o
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: core-e
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
  - type: Machine
    board: null
  - type: Lathe
    idleState: core-idle
    runningState: core-active
    staticPacks:
    - XenoborgMachines
    - EmptyXenoborgs
    - XenoborgUpgradeModules
  - type: MaterialStorage
    whitelist:
      tags:
      - XenoborgCrystal
      - Sheet
  - type: PointLight
    color: "#0033ff"
    enabled: true
    radius: 4
    netsync: false
  - type: Anchorable
    flags:
    - Anchorable
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 275
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:SpawnEntitiesBehavior
        spawn:
          MachineFrameDestroyed:
            min: 1
            max: 1
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 1000
          moles:
            CarbonDioxide: 340.5701689 # carbon dioxide
          temperature: 373.15
  - type: Repairable
    doAfterDelay: 30 # you can heal the mothership core, but it takes a while
  - type: DamagedSiliconAccent
    enableChargeCorruption: false
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 2
    totalIntensity: 200
  #IS14-change: MothershipEye replaces the fixed surveillance-camera viewer.
  - type: RoboticsConsole
    allowBorgControl: false
    radioChannel: Xenoborg
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: Mothership
    transmitFrequencyId: Mothership
  - type: WirelessNetwork
    range: 10000 # mothership can see them from very far
  - type: WiresPanel
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      #IS14-change start
      enum.CyborgUiKey.Model:
        type: CyborgModelBoundUserInterface
      enum.CyborgUiKey.Skin:
        type: CyborgSkinBoundUserInterface
      enum.CyborgUiKey.Maintenance:
        type: CyborgMaintenanceBoundUserInterface
      enum.MothershipEyeUiKey.Key:
        type: MothershipEyeBoundUserInterface
      #IS14-change end
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
        requireInputValidation: false
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.RoboticsConsoleUiKey.Key:
        type: RoboticsConsoleBoundUserInterface
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: Pullable
  - type: StaticPrice
    price: 800
  - type: WarpPoint
    location: location-mothership-core
    follow: true
  - type: VoiceOverride
    nameOverride: MOTHERSHIP CORE
  - type: TypingIndicator
    proto: xenoborg
  - type: Speech
    speechVerb: Robotic
    speechSounds: Xenoborg
    allowedEmotes:
    - Laugh
  - type: Vocal
    emoteSounds: UnisexSiliconXenoborg
    wilhelmProbability: 0
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Mothership
    - Xenoborg
    - Binary
  - type: ActiveRadio
    channels:
    - Mothership
    - Xenoborg
    - Binary
  - type: Xenoborg
    mindRole: MindRoleMothershipCore
    briefingText: mothership-welcome
  - type: MothershipCore
  - type: Tag
    tags:
    - SiliconEmotes
    - CanPilot
    - Structure
  - type: GuideHelp
    guides:
    - Robotics
    - Xenoborgs
  - type: Inventory
    templateId: borg
  - type: NpcFactionMember
    factions:
    - Xenoborg
  - type: Hands
    showInHands: false
    disableExplosionRecursion: true
    canBeStripped: false
  #IS14-change start - tools, OS and maintenance are provided by the IS14 cyborg system.
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot { }
      cyborg_brain: !type:ContainerSlot { }
      cyborg_tools: !type:Container { }
      cyborg_upgrades: !type:Container { }
  #IS14-change end
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
  - type: Puller
    needsHands: false
  - type: Eye
    drawFov: false
  # - type: StationAiOverlay # removed until is no longer buggy
  - type: IgnoreUIRange
  - type: ComplexInteraction
  - type: MindContainer
  - type: SiliconLawBound
  - type: Actions
  - type: ActionGrant
    actions:
    - ActionViewLaws
  - type: SiliconLawProvider
    laws: MothershipCoreLawset # custom laws here
    subverted: true
  - type: Stripping
  - type: Access
    enabled: true
    tags:
    - Xenoborg
  - type: LockingWhitelist
    blacklist:
      components:
      - RoboticsConsole
    whitelist:
      components:
      - BorgChassis
      #IS14-change start - IS14 xenoborgs use Cyborg instead of BorgChassis.
      - Xenoborg
      #IS14-change end
  - type: IntrinsicUI
    uis:
      #IS14-change start
      enum.MothershipEyeUiKey.Key:
        toggleAction: IS14ActionMothershipEye
      enum.LatheUiKey.Key:
        toggleAction: IS14ActionMothershipLathe
      #IS14-change end
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionAGhostShowRadar
      enum.RoboticsConsoleUiKey.Key:
        toggleAction: ActionXenoborgControlMonitor
  - type: ShowElectrocutionHUD
  - type: PowerMonitoringCableNetworks
  - type: RadarConsole
  - type: LanguageKnowledge # Einstein Engines - Languages. Xenoborgs understand every language so give this one to their core aswell
    speaks:
    - TauCetiBasic
    - Canilunzt
    - Bubblish
    - Nekomimetic
    - Draconic
    - SolCommon
    - RootSpeak
    - Moffic
    - ValyrianStandard
    - Chittin
    - SiikMaas
    - RobotTalk
    - Marish
    - Elyran
    - Freespeak
    - Tradeband
    - Schechi
    - NewKinPidgin
    understands:
    - TauCetiBasic
    - Canilunzt
    - Bubblish
    - Nekomimetic
    - Draconic
    - SolCommon
    - RootSpeak
    - Moffic
    - ValyrianStandard
    - Chittin
    - SiikMaas
    - RobotTalk
    - Marish
    - Elyran
    - Freespeak
    - Tradeband
    - Sign
    - Schechi
    - NewKinPidgin

- type: entity
  parent: BaseAGhostAction
  id: ActionXenoborgControlMonitor
  name: Xenoborgs Control Console
  description: View the Xenoborgs Control Console
  components:
  - type: Action
    keywords: [ "Mothership Core", "console", "interface" ]
    priority: -6
  - type: Sprite
    sprite: Interface/Actions/actions_borg.rsi
    layers:
    - state: xenoborg-control-computer
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent { key: enum.RoboticsConsoleUiKey.Key }

- type: entity
  parent: BaseAGhostAction
  id: ActionXenoborgCameraMonitor
  name: Xenoborgs Camera Monitor
  description: View the Xenoborgs Camera Monitor
  components:
  - type: Action
    keywords: [ "Mothership Core", "console", "interface" ]
    priority: -6
  - type: Sprite
    sprite: Interface/Actions/actions_borg.rsi
    layers:
    - state: xenoborg-camera-computer
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent { key: enum.SurveillanceCameraMonitorUiKey.Key }
