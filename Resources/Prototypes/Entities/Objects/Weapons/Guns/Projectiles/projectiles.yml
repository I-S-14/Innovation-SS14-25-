- type: entity
  name: icewing watcher bolt
  id: WatcherBoltIcewing
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: Projectile
    #   soundHit:  Waiting on serv3
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Cold: 15 # goob - matches magmawings in terms of damage
  - type: ChangeTemperatureOnCollide
    heat: -30000 # Lavaland Change

- type: entity
  parent: BulletRocket
  id: BulletSingularityBusterRocket
  categories: [ HideSpawnMenu ]
  name: singularity buster rocket
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: buster
  - type: SinguloFood
    energy: -500
  - type: Explosive # Goob
    explosionType: Electrical
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 150
    maxTileBreak: 1
  - type: SmartLinkBlacklist  # Goobstation

- type: entity
  name : disabler bolt smg
  id: BulletDisablerSmg
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser
      shader: unshaded
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque
        - Impassable
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: false
  - type: Ammo
  - type: StaminaDamageOnCollide
    damage: 12 # Goob edit
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Heat: 0
        Ion: 4 # DeltaV
    soundHit:
      collection: WeakHit
    forceSound: true
