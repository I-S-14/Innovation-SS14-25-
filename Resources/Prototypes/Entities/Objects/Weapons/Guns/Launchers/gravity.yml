- type: entity
  abstract: true
  parent: BaseItem
  id: BaseWeaponGravityGun
  components:
  - type: Item
    size: Normal
  - type: ItemToggleExaminableStatus
  - type: ItemToggle
    onUse: false
  - type: ToggleableVisuals
    spriteLayer: unshaded
    inhandVisuals:
      left:
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right-unshaded
        shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TetherVisualsStatus.Key:
        unshaded:
          True: { visible: true }
          False: { visible: false }





- type: entity
  parent: [ BaseWeaponGravityGun, PowerCellSlotMediumItem ]
  id: WeaponTetherGun
  name: tether gun
  description: Manipulates gravity around objects to fling them at high velocities.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/tether_gun.rsi
    layers:
    - state: base
    - state: base-unshaded
      map: [ "unshaded" ]
      shader: unshaded
      visible: false
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 125
      Glass: 100
      Silver: 25
  - type: PowerCellDraw
  - type: ToggleCellDraw
  - type: TetherGun
    frequency: 5
    dampingRatio: 4
    maxForce: 300 # goob
    massLimit: 150 # goob





- type: entity
  parent: WeaponTetherGun
  id: WeaponTetherGunEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default




- type: entity
  parent: [ BaseWeaponGravityGun, PowerCellSlotMediumItem ]
  id: WeaponForceGun
  name: force gun
  description: Manipulates gravity around objects to fling them at high velocities.
  components:
  - type: Item
    storedRotation: -90 #Goob
    #size: Normal #Goob
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/force_gun.rsi
    layers:
    - state: base
    - state: base-unshaded
      map: [ "unshaded" ]
      shader: unshaded
      visible: false
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 125
      Glass: 100
      Silver: 50
  - type: PowerCellDraw
  - type: ToggleCellDraw
  - type: ForceGun
    frequency: 15
    dampingRatio: 4
    throwDistance: 20 # goob
    massLimit: 50
    lineColor: "#18a2d5"
    soundLaunch:
      path: /Audio/Weapons/soup.ogg
      params:
        volume: 2





- type: entity
  parent: WeaponForceGun
  id: WeaponForceGunEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default



