- type: entity
  name: arm blade
  parent: BaseItem
  id: ArmBlade
  description: A grotesque blade made out of bone and flesh that cleaves through people as a hot knife through butter.
  components:
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: Objects/Weapons/Melee/armblade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 90
    attackRate: 0.75
    damage:
      types:
        Slash: 25
        Piercing: 15
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/armblade.rsi
  - type: Prying
  - type: UseDelay # Goobstation - For insta prying
    delay: 1
  - type: Scalpel # Shitmed
    speed: 0.3
  - type: BoneSaw # Shitmed
    speed: 0.75
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/saw.ogg

- type: entity
  name: armblade
  parent: BaseItem
  id: Armblade
  description: A grotesque blade made out of bone and flesh that can pry open doors and cleaves through people as a hot knife through butter.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: Objects/Weapons/Melee/armblade.rsi
    state: icon
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    wideAnimationRotation: 90
    attackRate: 1
    damage:
      types:
        Slash: 10
        Piercing: 10
        Caustic: 5
        Structural: 12
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/armblade.rsi
  - type: Prying
    speedModifier: 1.5 # Jaws of life speed
    pryPowered: true

- type: entity
  parent: Armblade
  id: ArmbladeDull
  suffix: Dull
  components:
  - type: MeleeWeapon
    damage:
      types:
        Slash: 5
        Piercing: 5
        Caustic: 2.5
        Structural: 6

