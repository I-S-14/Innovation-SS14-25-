- type: entity
  abstract: true
  parent: BaseItem
  id: GrenadeBase
  components:
  - type: ExplosionEffect # Goob
  - type: Sprite
    sprite: Objects/Weapons/Grenades/grenade.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: # Start fuse
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:TriggerBehavior # Goobstation Start
        keyOut: timer # explode immediately
      - !type:DoActsBehavior
        acts: ["Destruction"] # Goobstation End
  - type: Injurable
    damageContainer: Inorganic
  - type: Appearance
  - type: AnimationPlayer
  - type: Tag
    tags:
    - Grenade # Goobstation
    - HandGrenade
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  abstract: true
  parent: [ GrenadeBase, VolatileGrenadeBase ]
  id: ImpactGrenadeBase
  components:
  - type: TriggerOnLand
  - type: LandAtCursor
  - type: TriggerOnCollide
    fixtureID: fix1
    maxTriggers: 1

- type: entity # Instantly detonates/activates after taking 45 damage.
  abstract: true
  id: VolatileGrenadeBase
  components:
  - type: Destructible
    thresholds:
    - trigger: # immediately explode
        !type:DamageTrigger
        damage: 45
      behaviors:
      - !type:TriggerBehavior
        keyOut: timer
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity # Is destroyed without activating/detonating after taking 45 damage.
  abstract: true
  id: FragileGrenadeBase
  components:
  - type: Destructible
    thresholds:
    - trigger: # Disappear
        !type:DamageTrigger
        damage: 45
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
