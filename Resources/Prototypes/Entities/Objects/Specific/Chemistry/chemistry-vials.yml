# TODO: Have a seperate lid state that can be popped on and off (not as a seperate item) that changes whether the vial can be spilled or not.

- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialGlass, DrinkBase, DrinkBaseOpenable, DrinkBaseEmptyTrash, DrinkVisualsAll ]
  id: BaseChemistryVial
  components:
  - type: Item
    size: Tiny
  - type: Openable
    sound:
      collection: bottleCloseSounds # using closed here for the quieter sound
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: SolutionContainerManager #goob
    solutions:
      beaker:
        maxVol: 30
  - type: FitsInDispenser
    solution: beaker
  - type: ExaminableSolution
    exactVolume: true # It's a chemistry tool
    solution: beaker # Goob; this was forgotten during upstreaming, which caused the solution to not be examinable
  - type: Spillable
    solution: beaker
  - type: MixableSolution
    solution: beaker
  - type: RefillableSolution
    solution: beaker
  - type: DrainableSolution
    solution: beaker
  - type: DrawableSolution
    solution: beaker
  - type: InjectableSolution
    solution: beaker
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: SolutionItemStatus
    solution: beaker
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Edible
    edible: Drink
    solution: beaker
  - type: Tag
    tags:
    - Trash
    - CentrifugeCompatible # unique feature of vials
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Glass: 25
  - type: ThrowableBlocked # Goobstation
    behavior: Damage
    damage:
      types:
        Blunt: 15
  - type: HeatTint # Goob - color liquid by temperature
    colorGradient:
    - temperature: 200
      color: "#A0BCE0"
    - temperature: 293
      color: "#FFFFFF"
    - temperature: 350
      color: "#FFC0A8"
    - temperature: 800
      color: "#FF9880"
    affectedLayers:
    - "enum.SolutionContainerLayers.Fill"
  - type: SolutionContainerVisuals #goob
    maxFillLevels: 6
    inHandsMaxFillLevels: 4
    fillBaseName: fill-
    inHandsFillBaseName: -fill-
    solutionName: beaker
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 3 # can be thrown once without breaking

- type: entity
  abstract: true
  parent: [ BaseItem, DrinkBaseMaterialGlass, DrinkBaseEmptyTrash, DrinkVisualsAll ]
  id: BaseChemistryAmpoule # like a vial, but you can't open, you have to break it.
  components:
  - type: Item
    size: Tiny
  - type: Spillable
    canSpillFromHand: false
    solution: drink
  - type: ExaminableSolution
    exactVolume: true # It's a chemistry tool
  - type: Tag
    tags:
    - Trash
    - CentrifugeCompatible # unique feature of vials

## Entities

- type: entity
  parent: [SolutionTiny, BaseChemistryVial]
  id: ChemistryEmptyVial
  name: vial
  description: A small vial.
  components:
  - type: Item
    sprite: Objects/Specific/Chemistry/vial.rsi
  - type: Sprite
    sprite: Objects/Specific/Chemistry/vial.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    inHandsMaxFillLevels: 4
  - type: SolutionTransfer
    maxTransferAmount: 30
  - type: StaticPrice
    price: 100
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 0
            max: 1
        transferForensics: true

- type: entity
  parent: [SolutionVeryTiny, BaseChemistryVial]
  id: ChemistryEmptyVialSmall
  name: mini vial
  description: A smaller vial.
  components:
  - type: Item
    sprite: Objects/Specific/Chemistry/vial_mini.rsi
  - type: Sprite
    sprite: Objects/Specific/Chemistry/vial_mini.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    inHandsMaxFillLevels: 4
  - type: SolutionContainerManager
    solutions:
      beaker: #Goob
        maxVol: 10
  - type: SolutionTransfer
    maxTransferAmount: 10
  - type: StaticPrice
    price: 50
  - type: PhysicalComposition
    materialComposition:
      Glass: 10

- type: entity
  parent: [SolutionTiny, BaseChemistryAmpoule]
  id: ChemistryEmptyAmpoule
  name: ampoule
  description: Break to open.
  components:
  - type: Item
    sprite: Objects/Specific/Chemistry/ampoule.rsi
  - type: Sprite
    sprite: Objects/Specific/Chemistry/ampoule.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    inHandsMaxFillLevels: 4
  - type: StaticPrice
    price: 100
  - type: PhysicalComposition
    materialComposition:
      Glass: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 0
            max: 1
        transferForensics: true

## Reagent filled

- type: entity
  parent: ChemistryEmptyVial
  id: VestineChemistryVial
  suffix: vestine
  components:
  - type: Label
    localizedLabel: reagent-name-vestine
  - type: SolutionContainerManager
    solutions:
      beaker: #Goob
        maxVol: 30
        reagents:
        - ReagentId: Vestine
          Quantity: 30
  - type: Solution
    solution:
      reagents:
      - ReagentId: Vestine
        Quantity: 30
  - type: Tag
    tags: &TagVial # Remove trash tag when we have a filled solution
    - CentrifugeCompatible

