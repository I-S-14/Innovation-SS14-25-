- type: entity
  parent: [ SolutionLarge, DrinkBaseMaterialStrongPlastic, DrinkBase, DrinkVisualsFill ]
  id: Bucket
  name: bucket
  description: It's a boring old bucket.
  components:
  - type: Edible
    utensil: Spoon
  - type: Sprite
    sprite: Objects/Tools/bucket.rsi
  - type: Item
    size: Large
    shape:
    - 0,0,2,3
  - type: Solution
    solution:
      maxVol: 360 # 3 litres
  - type: Clothing
    sprite: Objects/Tools/bucket.rsi
    slots:
    - HEAD
    quickEquip: false
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.03"
  - type: SolutionTransfer
    transferAmount: 120
    maxTransferAmount: 360
    minTransferAmount: 60
  - type: SpillWhenWorn
    solution: drink
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    inHandsFillBaseName: null
  - type: Tag
    tags:
      - Bucket
  - type: DnaSubstanceTrace
  - type: Armor #Goobstation
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0
      OrganDamage: 0
      BoneDamage: 0.05
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.95
  - type: StaticPrice # Goobstation
    price: 20

- type: entity
  parent: [SolutionHuge, Bucket]
  id: BorgBucket
  name: internal tank
  description: The internal reservoir of a cyborg, twice the normal size of a bucket.
  components:
  - type: SolutionTransfer
    transferAmount: 240
    maxTransferAmount: 480
