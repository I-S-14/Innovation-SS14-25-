- type: entity
  parent: BaseItem
  name: light replacer
  id: LightReplacer
  description: An item which uses magnets to easily replace broken lights. Refill by adding more lights into the replacer.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
    state: icon
  - type: Item
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
  - type: LightReplacer
  - type: EntityProvider
    canEject: false # Light Replacers have their own, more sophisticated UI.
    whitelist:
      components:
      - LightBulb
  - type: ContainerContainer
    containers:
      entity-provider: !type:Container
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 25
      Glass: 125
  - type: StaticPrice
    price: 100
  - type: UserInterface
    interfaces:
      enum.LightReplacerUiKey.Key:
        type: LightReplacerMenuBoundUserInterface
  - type: Tag
    tags:
    - DroneUsable # Goobstation

- type: entity
  parent: LightReplacer
  id: LightReplacerFilled
  suffix: Filled
  components:
  - type: EntityProvider
    entityCounter:
      LightTube: 8
      LightBulb: 5

# The following entities are solely used for sprites in the radial menu.
- type: entity
  id: EjectTubes
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
    state: eject-tubes

- type: entity
  id: EjectBulbs
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
    state: eject-bulbs
