- type: htnCompound
  id: PetCompound
  branches:
  - preconditions:
      - !type:HasOrdersPrecondition
        orders: enum.PetOrderType.Stay
    tasks:
      - !type:HTNCompoundTask
        task: IdleCompound
  - preconditions:
      - !type:HasOrdersPrecondition
        orders: enum.PetOrderType.Follow
    tasks:
      - !type:HTNCompoundTask
        task: FollowCompound
  - preconditions:
      - !type:HasOrdersPrecondition
        orders: enum.PetOrderType.Attack
    tasks:
      - !type:HTNCompoundTask
        task: RatServantTargetAttackCompound
  - preconditions:
      - !type:HasOrdersPrecondition
        orders: enum.PetOrderType.Loose
    tasks:
      - !type:HTNCompoundTask
        task: SimpleHostileCompound
